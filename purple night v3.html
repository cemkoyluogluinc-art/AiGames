ive eklendi.",unlockMap:"universite"},{label:"Kitap karın doyurmaz, erzakımızı kimseye vermeyin",effects:{food:6,order:-8,spark:-6,rep:{guild:-8,rural:4}},log:"Kütüphane kaderine terk edildi; ustaların morali bozuldu."}]},{id:"w5_dock_barons",kind:"story",week:5,speaker:"Kaptan Rıza",faction:"İskele Baronları",category:"İLK TEMAS",avatar:"⚓",portrait:"captain",text:"Mudanya iskelesinde eski mekanik dizel bir balıkçı teknesini yürüttük. Karşı yakadan tuz ve antibiyotik getirdik; karşılığında sağlam rulman ve bakır tel isteriz. Baronlar yeni düzenin ilk tüccarları — güvenleri kazanılırsa Marmara bizim olur.",choices:[{label:"Bakır ve rulman verip ilaçlarla tuzu mahalleliye al",effects:{food:12,copper:-12,meds:8,order:10,rep:{dock:12,rural:4}},log:"İskele Baronlarıyla ilk tuz ve ilaç takası yapıldı.",unlockMap:"iskele"},{label:"Teknelerinin enjektörünü tamir et, bakır vermeden anlaş",effects:{food:6,copper:-3,meds:4,spark:3,rep:{guild:6,dock:6}},log:"Ustalık konuştu; tekne onarılıp payımıza tuz alındı.",unlockMap:"iskele"},{label:"Baronların fahiş fiyatını reddet, kendi tuzumuzu kaynatalım",effects:{food:-6,copper:5,order:-5,rep:{dock:-12}},log:"İskele Baronları liman ambargosu tehdidiyle geri döndü."}]},{id:"w7_tractor",kind:"story",week:7,speaker:"Muhtar İlyas",faction:"Kırsal Kooperatif",category:"TARIM KRİZİ",avatar:"\uD83D\uDE9C",portrait:"farmer",text:"Bahar ekimi geldi ama ovadaki yeni nesil traktörlerin hepsi beyinleri yandığı için yatıyor. Köylerdeki 50 yıllık mekanik traktörlerin ise mazot pompaları revizyon istiyor. Ekim zamanı kaçarsa kışta aç kalırız.",choices:[{label:"Atölyeyi bir hafta tamamen traktör tamirine ayır",effects:{food:16,copper:-9,order:6,rep:{rural:14,guild:3},unlockMap:"koyler"},log:"Eski traktörler bitkisel yağ ve mazotla tarlaları sürmeye başladı!"},{label:"Yarım mesai tamir yap, kalan zamanda verici bobinlerini sar",effects:{food:7,copper:-5,spark:7,rep:{rural:4,guild:4},unlockMap:"koyler"},log:"Hem köylünün işi görüldü hem Kıvılcım vericisi ilerledi."},{label:"Mazot yerine ayçiçeği yağı dönüşüm kiti kur",effects:{food:10,fuel:6,copper:-7,rep:{rural:8,guild:5},unlockMap:"koyler"},log:"Traktörlere bitkisel yağ dönüşümü yapıldı; mazot tasarrufu başladı."}]},{id:"w9_watchmaker",kind:"story",week:9,speaker:"Saatçi Agop Usta",faction:"Torna Loncası",category:"ZANAAT",avatar:"⏱️",portrait:"scholar",text:"Dijital saatler ve kuvars piller öldüğünden beri vardiyaları ve telsiz dinleme saatlerini şaşırıyoruz. Çarşıdaki eski kurmalı saatleri ve fabrika düdüğünü senkronize edebilirim. Düzensiz zaman, düzensiz insan demektir.",choices:[{label:"Agop Usta’ya çırak ve pirinç dişli ver, Saat Kulesi’ni çalıştırsın",effects:{food:-4,copper:-7,order:12,spark:7,rep:{guild:10,rural:4,dock:2}},log:"Meydan saati ve vardiya düdüğü yeniden çalmaya başladı; düzen arttı."},{label:"Saatle uğraşacak vakit yok, güneş saatine devam",effects:{copper:3,order:-6,rep:{guild:-6}},log:"Vardiya karmaşası yüzünden atölyede tartışmalar çıktı."}]},{id:"w11_kalfa",kind:"story",week:11,speaker:"Baş Usta Kemal",faction:"Torna Loncası",category:"İÇ GÜVENLİK",avatar:"\uD83D\uDD27",portrait:"welder",text:"Tezgahlardan birinde çalışan iki kalfa, geceleri gizlice atölyenin sağlam rulmanlarını ve bakır tellerini İskele karaborsasında konserveyle takas ederken yakalandı! Mahalle meclisi toplandı; herkes senin kararını bekliyor.",choices:[{label:"Halkın önünde mahalleden sürgün et, ibret olsun",effects:{copper:5,order:10,spark:-4,rep:{guild:-4,rural:3,dock:-5}},log:"Sert ceza disiplini sağladı ama iki yetenekli kalfayı kaybettik.",followUp:"fu_kalfalar",setFlags:["kalfalar_suruldu"]},{label:"Konservelere el koy, kalfalara çift vardiya zorunlu bobin sardır",effects:{food:6,copper:3,order:-3,spark:9,rep:{guild:5}},log:"Kalfalar cezalarını Kıvılcım antenini sararak ödedi."},{label:"Suç ortaklarını ara — karaborsa Baronlarla bağlantıyı kopar",effects:{copper:8,order:4,rep:{dock:-10,guild:4}},log:"Karaborsa halkası çökertildi; bakır stoğu geri geldi."}]},{id:"w13_boiler",kind:"story",week:13,speaker:"Mühendis Selin",faction:"Torna Loncası",category:"ENERJİ",avatar:"\uD83D\uDD25",portrait:"scout",text:"Eski tekstil fabrikasının kazan dairesinde devasa bir kömürlü buhar kazanı bulduk! Onarırsak hem atölyenin kayış-kasnak tezgahlarını döndürür hem de yüksek güçlü dinamoyu besler. Ama bakır boru ve saç gerekiyor.",choices:[{label:"Tüm bakır ve hurda stoğunu buhar kazanına yatır!",effects:{food:-6,copper:-15,order:6,spark:16,rep:{guild:12}},log:"Buhar kazanı kükreyerek çalıştı! Kayış-kasnak hattı tam güçte."},{label:"Kazanı sadece parça parça onar, stoğun yarısını koru",effects:{copper:-8,spark:8,order:3,rep:{guild:5}},log:"Kazan yarı güçte devreye alındı; stok korundu."},{label:"Kazan çok riskli, küçük su çarkları ve pedallı dinamolarla yetin",effects:{food:3,copper:5,order:1,spark:4,rep:{rural:3}},log:"Güvenli ama düşük güçlü su çarkı sisteminde kalındı."}]},{id:"w15_epidemic",kind:"story",week:15,speaker:"Doktor Leyla",faction:"Mahalle Reviri",category:"SAĞLIK KRİZİ",avatar:"⚕️",portrait:"medic",text:"Arıtma tesisleri çalışmadığı için komşu mahallede tifo ve dizanteri vakaları başladı. Suyu kaynatmak için odun ve bakır imbik kazanları kurmalıyız. Salgın kapıya dayanmadan hamle yapmalıyız.",choices:[{label:"Bakır kazanları revire ver, zorunlu kaynatma nöbeti başlat",effects:{food:-5,copper:-10,order:12,meds:6,rep:{rural:8,guild:2}},log:"Bakır imbikler ve kaynatma kazanlarıyla salgın mahallemize girmeden önlendi."},{label:"Mahalle girişlerini kapatıp karantina ilan et, bakırı harcama",effects:{food:-8,copper:3,order:-10,rep:{rural:-10,dock:-6}},log:"Sert karantina ticaret yollarını kesti ve huzursuzluk yarattı."},{label:"Tıbbi stoku seferber et, sağlıkçıları komşu mahalleye gönder",effects:{meds:-10,order:8,rep:{rural:12,guild:3,dock:3}},log:"Sağlık ekibi komşu mahallede salgını bastırdı; itibar kazanıldı."}]},{id:"w17_bandit",kind:"story",week:17,speaker:"Gözcü Baran",faction:"Mahalle Muhafızları",category:"SAVUNMA",avatar:"\uD83D\uDEE1️",portrait:"soldier",text:"Eski otoyoldan zırhlandırılmış mekanik bir kamyonla gezen silahlı bir çete, atölyedeki çalışan dinamolarımızı ve erzak depomuzu duyup haraç istemeye geldi! Barikatlarımız var ama sayıları bizden fazla.",choices:[{label:"Buharlı basınç valfleri ve barikatlarla pusu kurup püskürt!",effects:{food:-3,copper:10,order:12,spark:3,rep:{guild:8,rural:8,dock:4}},log:"Yüksek basınçlı buhar hattı ve barikatlarla çete bozguna uğratıldı!"},{label:"Çatışmaya girip insan kaybetmeyelim, haraç verip savuştur",effects:{food:-12,copper:-8,order:-8,rep:{guild:-5,rural:-3}},log:"Haraç verildi; mahalle korundu ama halkın morali düştü."},{label:"Pazarlık masası kur: çetenin araçlarını biz tamir edelim",effects:{copper:6,order:4,rep:{dock:8,guild:4,rural:-4}},log:"Çete tamir atölyesi müşterisi oldu; haraç ticarete dönüştü."}]},{id:"w19_vacuum",kind:"story",week:19,speaker:"Cam Ustası Tarık",faction:"Torna Loncası",category:"KIVILCIM PROJESİ",avatar:"\uD83D\uDCA1",portrait:"scholar",text:"Elimizdeki son yedek radyo lambaları da ömrünü dolduruyor. Eski laboratuvar camlarını eritip cıva vakum pompasıyla kendi triyot vakum tüplerimizi üretebiliriz! Çağın sırrı yeniden bizde doğacak.",choices:[{label:"Cam atölyesini kur! İlk yerli vakum tüplerini imal et",effects:{food:-5,copper:-12,spark:18,rep:{guild:14,dock:3}},log:"El yapımı cam vakum tüpleri (lambalar) başarıyla test edildi!"},{label:"Üretim masraflı, eski radyolardan sağlam lamba aramaya devam et",effects:{food:2,copper:3,spark:6,rep:{guild:-3}},log:"Civardaki eski evlerden birkaç çıkma radyo lambası bulundu."}]},{id:"w21_harvest",kind:"story",week:21,speaker:"Muhtar İlyas",faction:"Kırsal Kooperatif",category:"HASAT PAZARLIĞI",avatar:"\uD83D\uDE9C",portrait:"farmer",text:"Yaz sonu hasadı toplandı! Kışlık buğday ve ayçiçek yağı ambarlarımız dolu. Ancak köylüler kış gelmeden evlerine döküm soba, balta ve pulluk demiri istiyor. Demir mi buğday mı — klasik takas pazarlığı.",choices:[{label:"Dökümhaneyi tam kapasite çalıştır, sobaları verip kışlık ambarı doldur",effects:{food:18,copper:-12,order:8,rep:{rural:14,guild:3}},log:"Döküm sobalar teslim edildi; kışlık buğday stoklarımız güvende."},{label:"Az sayıda soba ver, demiri anten kulesine sakla",effects:{food:6,copper:5,spark:9,order:-4,rep:{rural:-8,guild:4}},log:"Kırsal Kooperatif buğdayın sadece küçük bir kısmını verdi."},{label:"Sobaları krediyle ver, bahar hasadından faiziyle alsınlar",effects:{food:10,order:5,rep:{rural:6}},log:"Soba kredisi anlaşması yapıldı; bahar borcu kayda geçti."}]},{id:"w23_ferry",kind:"story",week:23,speaker:"Kaptan Rıza",faction:"İskele Baronları",category:"DENİZ SEFERİ",avatar:"⚓",portrait:"captain",text:"İskelede yatan eski feribotun elektronik kartları yanık ama ana dizel makinelerini mekanik regülatörle doğrudan çalıştırabiliriz! İstanbul yakasındaki büyük depolara sefer yapalım mı? Fırtına mevsimi yaklaşıyor, risk yüksek.",choices:[{label:"Mekanik regülatörü tak ve İstanbul seferine ortak ol!",effects:{food:10,copper:14,order:6,spark:8,fuel:-4,rep:{dock:15,guild:6}},log:"Feribot mekanik kumandayla Marmara’yı aştı; devasa bakır ve erzakla döndü!"},{label:"Deniz seferi çok tehlikeli, elimizdeki ustaları riske atamayız",effects:{order:3,rep:{dock:-8,rural:2}},log:"Kaptan Rıza sefere tek başına çıktı ve pay vermeyi reddetti."},{label:"Sadece kıyı rotasında küçük yük seferleri yap",effects:{food:6,copper:5,meds:4,rep:{dock:6}},log:"Kıyı boyunca güvenli takas seferleri düzenlendi."}]},{id:"w25_storm",kind:"story",week:25,speaker:"Kurye Defne",faction:"Keşif Ekibi",category:"DOĞA OLAYI",avatar:"\uD83C\uDF27️",portrait:"scout",text:"Şiddetli sonbahar fırtınası dağdan gelen dereyi taşırdı! Su türbinimiz aşırı devir yapıyor; valfleri kapatmazsak dinamo yanacak ama kapatırsak mahalle karanlıkta kalacak. Fırtına dorukta, karar anı şu an.",choices:[{label:"Ustaları halatlarla suya indir, fırtınada savak kapaklarını güçlendir",effects:{food:-6,copper:-6,order:5,spark:12,rep:{guild:8}},log:"Fırtınada türbin kurtarıldı; yüksek su debisiyle aküler tam doldu!"},{label:"Türbini boşa al, fırtına dinene kadar elektriği kes",effects:{copper:3,order:-8,spark:-4},log:"Mahalle 4 gün karanlıkta kaldı ama ekipman hasar görmedi."},{label:"Barikatları yükselt, seli tahıl ambarından uzaklaştır",effects:{food:8,copper:-4,order:6,rep:{rural:8}},log:"Sel suları kanallarla ambarın önünden çevrildi."}]},{id:"w27_coal",kind:"story",week:27,speaker:"Baş Usta Kemal",faction:"Torna Loncası",category:"İLK KIŞ HAZIRLIĞI",avatar:"❄️",portrait:"welder",text:"Kasım soğukları erken bastırdı, dağlara kar düştü. Hem evlerin sobaları hem de atölyenin buhar kazanı için kömür ve odun stoğumuz hızla eriyor. Kış uzun olacak ve depomuz dolu değil.",choices:[{label:"Kömürü öncelikle mahallenin ısınmasına ve fırınlara tahsis et",effects:{food:7,order:12,spark:-4,rep:{rural:10,guild:-3}},log:"Evler ve fırınlar sıcak tutuldu; kimse soğuktan hastalanmadı."},{label:"Atölye kazanını tam güçte tut, halk ortak büyük salonda ısınsın",effects:{food:-3,copper:6,spark:12,order:-8,rep:{guild:8,rural:-5}},log:"Üretim ve verici durmadı ama ortak yatakhane uygulaması homurtu yarattı."},{label:"Kömür ocaklarına keşif kervanı örgütleyin, stoku tazeleyin",effects:{fuel:10,copper:-5,order:3,rep:{guild:4}},log:"Kömür ocaklarından kervan döndü; depolar kısmen doldu.",unlockMap:"komur_ocagi"}]},{id:"w29_frost",kind:"story",week:29,speaker:"Mühendis Selin",faction:"Torna Loncası",category:"KIŞ KRİZİ",avatar:"\uD83E\uDD76",portrait:"scholar",text:"Gece eksi 14 derece! Su hattının ana vanası dondu ve borular çatlamaya başladı. Ayrıca sera yoksa fidelerimiz bu gece ölecek. Kış bize ilk faturayı kesiyor.",choices:[{label:"Boruları keçele ve vana odasına soba kur",effects:{food:6,copper:-7,order:4},log:"Vana odasına kurulan soba hattı kurtardı; borular onarıldı."},{label:"Fideleri atölyeye taşı, sobaların yanında kışlat",effects:{food:8,order:-3,spark:-3},log:"Fideler atölyede kışladı; tezgah araları sera oldu."},{label:"Acil çare: boruları boşalt, su taşımacılığına geç",effects:{order:-5,food:-4,fuel:-2},log:"Hattı boşalttık; su artık kızaklarla taşınıyor. Yorucu bir düzen."}]},{id:"w31_locomotive",kind:"story",week:31,speaker:"Demiryolcu Hasan",faction:"Eski Gar Ekibi",category:"DEMİRYOLU",avatar:"\uD83D\uDE82",portrait:"welder",text:"Eski tren garındaki müzelik kara tren (buharlı lokomotif) hâlâ sağlam! Kazan borularını elden geçirirsek Eskişehir-Ankara demiryolu hattına ilk keşif katarını sürebiliriz. Kara tren yeni dünyanın omurgası olabilir.",choices:[{label:"Lokomotifi revize et! Rayları açacak buhar katarını hazırla",effects:{food:-8,copper:-14,order:10,spark:15,rep:{guild:14,rural:8,dock:4}},log:"Kara tren yıllar sonra ilk kez düdüğünü çaldı ve buhar püskürttü!",unlockMap:"eski_gar",followUp:"fu_lokomotif",setFlags:["kara_tren"]},{label:"Lokomotif çok bakır yutar, sadece telsize odaklan",effects:{food:5,copper:6,spark:7,order:-3,rep:{guild:-4}},log:"Demiryolu projesi ertelendi; tüm güç radyo vericisine aktarıldı.",unlockMap:"eski_gar"}]},{id:"w33_wolves",kind:"story",week:33,speaker:"Gözcü Baran",faction:"Mahalle Muhafızları",category:"VAHŞİ DOĞA",avatar:"\uD83D\uDC3A",portrait:"soldier",text:"Kar buz kestiği için dağdan inen kurt sürüsü ahır ve ambar çevresinde dolaşmaya başladı. Gece nöbetçileri ateş yakıp teneke çalıyor ama sürü aç. Ayrıca kapan kurmak isteyenler var.",choices:[{label:"Ateş hattı ve teneke alarm sistemi kur, sürüyü uzak tut",effects:{copper:-5,order:8,food:-2,rep:{rural:6}},log:"Ateş ve teneke hattı kurtları uzak tuttu; kayıp verilmedi."},{label:"Kurt kapakları kur, kürk ve et için fırsata çevir",effects:{food:8,copper:-3,order:-4,rep:{rural:-6,guild:3}},log:"Üç kurt avlandı; kürkler takasa girdi ama köylüler kızgın."},{label:"Ahırı boşalt, hayvanları atölyeye sığın",effects:{order:3,spark:-4,food:3},log:"Hayvanlar atölye avlusunda güvende; ama verici bakımı aksadı."}]},{id:"w35_radio_op",kind:"story",week:35,speaker:"Telsizci Zehra",faction:"Boğaz İstasyonu",category:"YENİ YÜZ",avatar:"\uD83D\uDCFB",portrait:"medic",text:"Ben Zehra. Boğaz’daki sahil güvenlik istasyonunun son telsizcisiyim. El yapımı alıcınızın harmoniklerini üç haftadır dinliyorum. Vericiniz rezonansa yakın ama bobin sarımı hatalı. Beni işe alırsanız o hatayı bulurum.",choices:[{label:"Hoş geldin Zehra! Verici masanı hemen kur",effects:{crew:{telsizci:1},spark:10,order:4,food:-3},log:"Telsizci Zehra ekibe katıldı; verici bobinleri yeniden sarıldı."},{label:"Önce bir hafta deneme: mahalle için haftalık rapor ver",effects:{crew:{telsizci:1},order:8,spark:4,rep:{rural:5}},log:"Zehra deneme süresinde mahallenin gözbebeği oldu."},{label:"Yabancıları vericiye yaklaştırmayalım, sadece şemaları isteyelim",effects:{spark:5,order:-3,rep:{dock:-4}},log:"Zehra şemaları bıraktı ama kırılarak ayrıldı."}]},{id:"w37_first_signal",kind:"story",week:37,speaker:"Mühendis Selin",faction:"Torna Loncası",category:"İLK SES",avatar:"\uD83D\uDCE1",portrait:"scholar",text:'Gece yarısı kulaklıktaki parazitlerin arasından ilk kez DÜZENLİ bir sinyal duyduk! Nokta çizgi ritmi belli ki insan eli: "...ANKARA... BUHAR HATTI... HÂLÂ HAYATTA OLAN VAR MI..." Sinyal çok cılız ama oradalar. Gerçekten oradalar!',choices:[{label:"Tüm mahalleyi seferber et, çatıya büyük anten kulesini dik!",effects:{food:-8,copper:-12,order:12,spark:11,rep:{guild:12,rural:6,dock:6}},log:"Dev anten kulesi gökyüzüne yükseldi; mahallede büyük bir umut dalgası!",followUp:"fu_ankara",setFlags:["ilk_ses"]},{label:"Mevcut çatı antenini bakır telle uzat, kaynakları kışa sakla",effects:{food:3,copper:-3,spark:10,order:3},log:"Çatı anteni uzatıldı; sinyal biraz daha netleşti.",followUp:"fu_ankara",setFlags:["ilk_ses"]},{label:"Önce dinlemeye devam et, vericin tam kapasiteyi doğrula",effects:{spark:6,order:5,copper:2},log:"Dinleme nöbetleri kuruldu; Ankara mesajı teyit edildi.",followUp:"fu_ankara",setFlags:["ilk_ses"]}]},{id:"w39_tracking",kind:"story",week:39,speaker:"Telsizci Zehra",faction:"Atölye Verici Odası",category:"SİNYAL TAKİBİ",avatar:"\uD83D\uDCFB",portrait:"medic",text:"Ankara sinyali her gece 03:00’te tekrarlıyor ama iyonosfer kayması yüzünden frekans kayıyor. Frekans çevirici kondansatör grubu ve kristal kalibrasyonu lazım. Bulursam sinyal gücü ikiye katlanır.",choices:[{label:"Üniversiteden kondansatör grubu getir (keşif ekibi gönder)",effects:{spark:9,fuel:-3,rep:{guild:5}},log:"Kondansatör grubu bulundu; alıcı hassaslaştı."},{label:"Mika ve alüminyumdan kendi kondansatörlerini üret",effects:{copper:-8,spark:14,rep:{guild:8}},log:"Yerli mika kondansatörler sarıldı; Selin gözlerine inanamadı."},{label:"Elle ayar yapmaya devam, kaynakları erzağa aktar",effects:{food:8,spark:4},log:"Alıcı elle kalibre ediliyor; mutfak rahatladı."}]},{id:"w41_blizzard",kind:"story",week:41,speaker:"Muhtar İlyas",faction:"Kırsal Kooperatif",category:"BÜYÜK KAR FIRTINASI",avatar:"\uD83C\uDF28️",portrait:"farmer",text:"Güneş görmeden 6 gündür kar yağıyor; yollar kapandı, köylerle bağlantı koptu. Yakıt depoları kritik seviyede, hastalar revire sığındı. Bu fırtına bizi ya birleştirecek ya bölecek.",choices:[{label:"Kara treni/çifelerle köylere yakıt ve ilaç taşı",effects:{fuel:-6,meds:-4,order:12,rep:{rural:14},food:4},log:"Fırtınaya rağmen köylere ulaşan konvoy mahalleye kahraman yaptı."},{label:"Herkes atölye kompleksine sığın, kaynakları tek çatıda birleştir",effects:{food:6,order:6,spark:-5,rep:{rural:-3}},log:"Ortak yaşam düzeni kuruldu; tasarruf sağlandı ama verici aksadı."},{label:"Stokları merkezileştir, karne sistemi ilan et",effects:{food:10,order:-8,rep:{rural:-6,guild:3}},log:"Karne sistemi stokları korudu; ama kimse karneyi sevmedi."}]},{id:"w43_convoy",kind:"story",week:43,speaker:"Demiryolcu Hasan",faction:"Eski Gar Ekibi",category:"ESKİŞEHİR HABERİ",avatar:"\uD83D\uDE82",portrait:"welder",text:'Telgraftan Eskişehir garında bir buhar katarının hazırlandığı haberi geldi! Ankara-Eskişehir hattı canlanıyor; "Marmara’ya vagon dolusu çelik ve buhara gidiyoruz" diyorlar. Garına katılmak isteyenleri bekliyorlar.',choices:[{label:"Bakır ve ustalarla katıl — katarın tamir ekibinde yer al!",effects:{copper:-10,spark:11,order:8,rep:{guild:10}},log:"Marmara ustaları Eskişehir katarında yerini aldı!"},{label:"Sadece telgraf üzerinden teknik destek ver",effects:{spark:8,rep:{guild:5}},log:"Telgraf başından çizimler gönderildi; katar onarıldı."},{label:"Bu bir tuzak olabilir, tüm dikkat vericiye kalsın",effects:{order:-4,spark:6,rep:{guild:-6}},log:"Gar ekibi gönülsüzce reddedildi; kimse tuzak görmedi ama güven azaldı."}]},{id:"w45_ankara_calls",kind:"story",week:45,speaker:"Mühendis Selin",faction:"Torna Loncası",category:"ANKARA ÇAĞRISI",avatar:"⚡",portrait:"scholar",text:'Ankara ve Eskişehir hattından gelen Mors sinyalleri artık çok net: "MARMARA İSTASYONU, CEVAP VERİN! TEKRAR EDİYORUM: MARMARA İSTASYONU, CEVAP VERİN!" Vericiye tam güç yüklenmeye sadece birkaç adım kaldı.',choices:[{label:"Dinleme kulelerini üç vardiya çalıştır, her detayı kaydet",effects:{food:-4,spark:12,order:6,rep:{guild:6}},log:"Üç vardiyalı dinleme nöbeti başladı; Ankara protokolü çözüldü."},{label:"Cevap hazırlığı: buhar kazanını ve dinamoları senkronize et",effects:{copper:-8,spark:12,order:5,rep:{guild:8}},log:"Kazan-dinamo senkronizasyonu tamamlandı; verici hazır."},{label:"Mahalleye duyur — umut herkesin omuzlarında yükselsin",effects:{order:12,spark:8,rep:{rural:8,dock:4}},log:"Mahalle meydanında ilk defa umut naraları yükseldi."}]},{id:"w47_final",kind:"story",week:47,speaker:"Mühendis Selin",faction:"Torna Loncası",category:"FİNAL YAYIN",avatar:"\uD83D\uDCE1",portrait:"scholar",text:"An her şey buna bağlı: tüm dinamolar, buhar kazanı ve bakır sargılar tek devrede birleşiyor. Maniple tuşuna basarsak Marmara’nın sesi Ankara’ya, oradan tüm Anadolu’ya ulaşacak. Ama tam güç yüklemesi stokların büyük kısmını tüketecek ve geri dönüşü yok.",choices:[{label:"Tüm dinamoları ve buhar kazanını birleştir, TAM GÜÇ YAYIN YAP!",effects:{food:-6,copper:-8,order:10,spark:13,rep:{guild:12,rural:8,dock:8}},log:"Büyük Mors vericisi tam kapasiteyle Anadolu hattına bağlandı!"},{label:"Kademeli güç ver, önce mahallenin kışlık dengesini garantiye al",effects:{food:7,copper:3,order:6,spark:9,rep:{guild:5,rural:5,dock:5}},log:"Verici güvenli modda çalıştırıldı; sinyal adım adım güçleniyor."},{label:"Bir hafta bekle — son stok kontrolü ve kablo yalıtımı",effects:{copper:-2,order:-2,spark:9},log:"Son kontrol yapıldı; her ekran mükemmel ama zaman daralıyor."}]},{id:"w49_spring_thaw",kind:"story",week:49,speaker:"Muhtar İlyas",faction:"Kırsal Kooperatif",category:"YENİ SEZON",avatar:"\uD83C\uDF31",portrait:"farmer",text:"İlk yılı atlattık! Kar eriyor, toprak yumuşuyor ve ovada ikinci ekim sezonu başlıyor. Ama bu sefer daha büyük düşünmeliyiz — sadece mahalle değil, bölge çapında tarım koordinasyonu lazım. Köyler arasında tohum ve gübre paylaşım ağı kurmalıyız.",choices:[{label:"Bölgesel tarım kooperatifi kur, tohum bankası oluştur",effects:{food:18,copper:-8,order:8,rep:{rural:14,guild:4}},log:"Bölgesel tohum bankası kuruldu; ikinci yılın hasadı güvence altında."},{label:"Sadece kendi tarlalarımıza odaklan, fazlalığı satışa çıkar",effects:{food:10,copper:6,order:-4,rep:{rural:-6,dock:4}},log:"Kendi hasadımız güçlü ama bölgesel dayanışma zayıfladı."},{label:"Sera ve sulama sistemini genişlet, kışlık stok biriktir",effects:{food:14,copper:-6,spark:4,rep:{guild:6,rural:6}},log:"Genişletilmiş sera sistemiyle dört mevsim üretim başladı."}]},{id:"w50_railroad",kind:"story",week:50,speaker:"Makinist Hüseyin",faction:"Demiryolu Ekibi",category:"ULAŞIM",avatar:"\uD83D\uDE82",portrait:"welder",text:"Kara tren hattının Eskişehir'e kadar olan kısmını temizledik. Buharlı lokomotif düzenli sefer yapabilir ama raylar bazı bölgelerde haydut kontrolünde. Eskişehir'le ticaret hattı açmak hem zenginlik hem risk demek.",choices:[{label:"Zırhlı vagon ekleyip askeri konvoy düzenle",effects:{food:-6,copper:-10,order:12,spark:8,fuel:-8,rep:{guild:10,dock:6}},log:"Eskişehir demiryolu hattı zırhlı konvoylarla açıldı!"},{label:"Haydutlarla geçiş anlaşması yap, haraç öde",effects:{food:-8,copper:5,order:-4,spark:4,rep:{dock:8,rural:-4}},log:"Haydutlara geçiş ücreti ödenerek hat açıldı."},{label:"Alternatif güzergah keşfet, dağ yolundan ilerle",effects:{food:-4,copper:-5,spark:6,fuel:-6,rep:{guild:6}},log:"Dağ güzergahı keşfedildi; daha uzun ama güvenli."}]},{id:"w51_izmir_signal",kind:"story",week:51,speaker:"Telsizci Elif",faction:"Kıvılcım İstasyonu",category:"İLETİŞİM",avatar:"\uD83D\uDCE1",portrait:"scout",text:"İzmir'den güçlü bir radyo sinyali yakaladık! Ege kıyısında bir tersane topluluğu var — gemi inşa ediyorlar ve Akdeniz ticaret rotası açmak istiyorlar. Onlarla irtibat kurmak Marmara'nın ötesine açılmak demek.",choices:[{label:"Tam güç verici ile İzmir hattını kur, ticaret anlaşması teklif et",effects:{food:4,copper:-6,spark:14,rep:{dock:12,guild:6}},log:"İzmir ile düzenli radyo bağlantısı kuruldu!"},{label:"Sadece bilgi alışverişi yap, henüz taahhüt verme",effects:{spark:8,rep:{dock:4}},log:"İzmir'le bilgi paylaşımı başladı; temkinli yaklaşım."},{label:"İzmir riskli, Ankara hattını güçlendir",effects:{spark:10,order:4,rep:{guild:4,rural:4}},log:"Ankara hattı öncelik aldı; İzmir bekleyecek."}]},{id:"w52_warlord",kind:"story",week:52,speaker:"Gözcü Baran",faction:"Mahalle Muhafızları",category:"TEHDİT",avatar:"\uD83D\uDEE1\uFE0F",portrait:"soldier",text:"Güneydoğudan gelen haberler korkutucu: kendine 'Bozkır Lordu' diyen bir savaş şefi, eski askeri üslerden ağır silahlar toplamış ve bölgeleri tek tek ilhak ediyor. Şimdi gözünü Marmara'ya dikti. Hazırlık zamanı.",choices:[{label:"Tüm bölge liderlerini savunma ittifakına çağır",effects:{food:-8,copper:-12,order:14,spark:6,rep:{guild:10,rural:10,dock:10}},log:"Marmara Savunma İttifakı kuruldu!"},{label:"Atölyede buhar topları ve barikat sistemleri üret",effects:{food:-4,copper:-14,order:8,spark:10,rep:{guild:12}},log:"Buhar basınçlı savunma silahları üretildi!"},{label:"Bozkır Lordu'yla diplomatik kanal aç, savaşı önle",effects:{food:-6,copper:4,order:-6,spark:4,rep:{dock:8,rural:-6}},log:"Bozkır Lordu ile görüşme kanalı açıldı; barış mı, tuzak mı?"}]},{id:"w53_hospital",kind:"story",week:53,speaker:"Doktor Leyla",faction:"Marmara Sağlık Birliği",category:"ALTYAPI",avatar:"⚕\uFE0F",portrait:"medic",text:"Artık sadece bir revir yetmiyor. Bölge genelinde salgın takip sistemi, ilaç üretim atölyesi ve cerrahi ekipman lazım. Üniversite külliyesinin eski tıp fakültesini hastaneye dönüştürebiliriz.",choices:[{label:"Tıp fakültesini tam donanımlı hastaneye çevir",effects:{food:-10,copper:-14,order:14,meds:16,rep:{rural:14,guild:8,dock:6}},log:"Marmara Bölge Hastanesi açıldı!"},{label:"Sadece eczane ve küçük klinik kur, kaynakları koru",effects:{food:-4,copper:-6,meds:8,order:4,rep:{rural:6}},log:"Mahalle kliniği ve eczanesi açıldı."},{label:"Sağlık eğitimi programı başlat, herkesi ilk yardımcı yap",effects:{food:-2,copper:-4,order:8,meds:4,rep:{rural:8,guild:4}},log:"Toplum sağlığı eğitim programı başlatıldı."}]},{id:"w55_federation",kind:"story",week:55,speaker:"Vali Yardımcısı Canan",faction:"Ankara Geçici Hükümeti",category:"SİYASET",avatar:"\uD83C\uDFF0",portrait:"scholar",text:"Ankara'dan resmi bir teklif geldi: Marmara Federasyonu kuruluş anlaşması. Sen, İskele Baronları, Kırsal Kooperatif ve Torna Loncası — dört kurucu üye olarak yeni düzenin temelini atacaksınız. Ama herkesin farklı talepleri var.",choices:[{label:"Eşit oy hakkı ve ortak kaynak paylaşımıyla demokratik federasyon kur",effects:{food:-4,copper:-6,order:16,spark:12,rep:{guild:8,rural:12,dock:8}},log:"Marmara Demokratik Federasyonu kuruldu! Tarih yazıldı."},{label:"Teknik liderlik modeliyle yönet — atölye ve enerji merkez olsun",effects:{food:-2,copper:-8,order:8,spark:16,rep:{guild:14,rural:4,dock:4}},log:"Teknik Liderlik Konseyi kuruldu; enerji ve üretim merkezi olduk."},{label:"Federasyonu reddet, bağımsız kal",effects:{food:6,copper:8,order:-10,spark:-4,rep:{guild:-6,rural:-8,dock:-8}},log:"Federasyon teklifi reddedildi; yalnız kaldık."}]},{id:"w57_power_grid",kind:"story",week:57,speaker:"Mühendis Selin",faction:"Enerji Konseyi",category:"MEGA PROJE",avatar:"⚡",portrait:"scout",text:"Rüya gerçek oluyor: bölgedeki tüm su çarkı dinamoları, buhar kazanları ve rüzgar türbinlerini birbirine bağlayacak bir enerji şebekesi tasarladık. Bu, Mor Gece öncesi elektrik ağının ilkel ama çalışan bir versiyonu olacak!",choices:[{label:"Tam ölçekli enerji şebekesini inşa et",effects:{food:-8,copper:-18,order:10,spark:22,rep:{guild:14,rural:8,dock:8}},log:"Marmara Enerji Şebekesi devreye girdi! Işıklar yeniden yandı!"},{label:"Sadece kritik tesisleri bağla: hastane, atölye, istasyon",effects:{food:-4,copper:-10,spark:14,order:6,rep:{guild:8}},log:"Kritik altyapı enerji hattına bağlandı."},{label:"Her bölge kendi enerjisini üretsin, merkezi şebeke riskli",effects:{copper:4,spark:6,order:-4,rep:{rural:4,dock:4}},log:"Dağıtık enerji modeli benimsendi; yavaş ama güvenli."}]},{id:"w58_bozkir_attack",kind:"story",week:58,speaker:"Komutan Baran",faction:"Marmara Savunma Gücü",category:"SAVAŞ",avatar:"\uD83D\uDEE1\uFE0F",portrait:"soldier",text:"Bozkır Lordu saldırıya geçti! Mekanize piyadeler güneydoğu geçidinden ilerliyorlar. Eskişehir düştü — sıradaki hedef bizim bölge. Demiryolu hattını savunmazsak her şeyi kaybederiz. Bu, Mor Gece'den beri en büyük kriz!",choices:[{label:"Tüm kuvvetleri topla, demiryolu hattında meydan savaşı ver",effects:{food:-14,copper:-10,order:16,spark:8,fuel:-10,rep:{guild:12,rural:12,dock:10}},log:"Demiryolu Muharebesi kazanıldı! Bozkır Lordu püskürtüldü!",dice:{dc:4,success:{effects:{food:-8,copper:14,order:18,spark:10},log:"Ezici zafer! Bozkır ordusunun teçhizatı ganimet alındı!"},fail:{effects:{food:-16,copper:-8,order:-12},log:"Ağır kayıplar verdik ama hattı tuttuk."}}},{label:"Gerilla taktiğiyle yıprat, açık savaştan kaçın",effects:{food:-6,copper:-4,order:4,spark:4,rep:{guild:6,rural:4}},log:"Gerilla savaşıyla düşman yavaşlatıldı."},{label:"Ankara'dan takviye iste, savunmayı geciktir",effects:{food:-4,order:-6,spark:6,rep:{dock:-4}},log:"Ankara takviye sözü verdi ama zaman kaybedildi."}]},{id:"w59_reconstruction",kind:"story",week:59,speaker:"Mimar Zeynep",faction:"İmar Konseyi",category:"İNŞA",avatar:"\uD83C\uDFD7\uFE0F",portrait:"scholar",text:"Savaş bitti, şimdi inşa zamanı. Yıkılan bölgeleri yeniden kurarken geleceğin temellerini de atmalıyız: okullar, atölyeler, hastaneler. İlk elektrikli sokak lambaları bile mümkün — Mor Gece'nin karanlığı sona eriyor.",choices:[{label:"Kapsamlı imar planı: okul, kütüphane ve aydınlatma",effects:{food:-8,copper:-14,order:16,spark:16,rep:{guild:12,rural:14,dock:10}},log:"Kapsamlı imar planı hayata geçirildi; sokak lambaları yandı!"},{label:"Önce savunmayı güçlendir, imar sonra gelsin",effects:{food:-4,copper:-8,order:10,spark:6,rep:{guild:8}},log:"Savunma hatları yenilendi; imar ertelendi."},{label:"Halka imar önceliğini seçtir, demokratik karar",effects:{food:-6,copper:-10,order:14,spark:10,rep:{rural:12,dock:8}},log:"Halk oylamasıyla imar öncelikleri belirlendi."}]},{id:"w60_new_dawn",kind:"story",week:60,speaker:"Tüm Marmara Halkı",faction:"Marmara Federasyonu",category:"FİNAL",avatar:"\uD83C\uDF05",portrait:"welder",text:"18 ay önce gökyüzü mora boyanmış ve dünya kararmıştı. Şimdi buhar düdükleri çalıyor, demiryolları işliyor, radyo dalgaları kıtayı sarıyor. Sen bir atölye ustasıydın — şimdi yeni dünyanın mimarısın. Mekanik Rönesans başladı.",choices:[{label:"Federasyon bayrağını çatıya çek, yeni çağı ilan et",effects:{food:10,copper:10,order:20,spark:20,rep:{guild:14,rural:14,dock:14}},log:"Marmara Federasyonu bayrağı dalgalanıyor. Mekanik Rönesans başladı!"},{label:"Sessizce gülümse, tornaya dön — yapılacak daha çok iş var",effects:{food:6,copper:6,order:12,spark:14,rep:{guild:16}},log:"Usta ellerini sildi ve tornaya döndü. İş bitmez."},{label:"Kutlama şöleni düzenle, herkes hak ediyor",effects:{food:-6,copper:-4,order:18,spark:12,rep:{rural:14,dock:14,guild:10}},log:"Büyük kutlama şöleni! Tüm Marmara bir arada."}]},{id:"w10_roof",kind:"story",week:10,speaker:"Çatı Tamircisi Ziya",faction:"Torna Loncası",category:"ONARIM",avatar:"🏚️",portrait:"welder",text:"Mart rüzgârı atölyenin kiremit çatısını yırttı; kirişlerden biri çatladı ve yağmur tezgahların üstüne akıyor. Çatı Tamircisi Ziya merdivenin başında bekliyor: \"Usta, iki gün içinde kapatmazsak torna yatakları paslanır. Bakır mı verirsin, yoksa ormandan kereste mi indirelim?\"",choices:[{label:"Ziya ile birlikte çatıya çık, kirişi yerinde kaynakla",effects:{},dice:{dc:4,success:{effects:{copper:-6,order:8,spark:4,rep:{guild:8}},log:"Ziya ile çatıda zorlu bir kaynak yapıldı; kiriş tuttu ve tezgahlar kuru kaldı."},fail:{effects:{copper:-8,order:-4,rep:{guild:-3}},log:"Kaynak tutmadı, kiriş ikinci kez çatladı; iki gün üretim durdu."}}},{label:"Bakır levha ve perçin ver, çatıyı kalıcı kapat",effects:{copper:-10,order:6,spark:2,rep:{guild:5}},log:"Bakır levha çatıya perçinlendi; atölye artık yağmur geçirmiyor."},{label:"Ormandan kereste indir, ahşap iskeletle destekle",effects:{fuel:-3,food:-2,order:4,copper:2,rep:{rural:4}},log:"Ormandan indirilen karaçam kirişlerle çatı ahşap iskeletle desteklendi."}]},{id:"w12_mountain",kind:"story",week:12,speaker:"Dağ Köyünden Enver",faction:"Kırsal Kooperatif",category:"UZAK ÇAĞRI",avatar:"⛰️",portrait:"scout",text:"Uludağ'ın yukarısındaki dört haneli köyden Enver geldi; ayakları donmuş, sesi kısılmış. \"Dereden gelen su borumuz patladı, üç gündür kar suyu içiyoruz. Sizde bakır boru var dediler. Karşılığında ne istersen veririz.\" Yol ise çığ riski taşıyan tek bir patikadan geçiyor.",choices:[{label:"Enver'le birlikte patikaya çık, boruyu yerinde onar",effects:{},dice:{dc:4,success:{effects:{copper:-7,food:6,order:6,rep:{rural:12,guild:4}},log:"Çığ riskine rağmen dağ köyünün borusu onarıldı; köy teşekkür olarak erzak gönderdi."},fail:{effects:{copper:-7,order:-5,food:-3,rep:{rural:3}},log:"Patikada çığ düştü; ekip yarım boruyla geri döndü, köyün umudu kırıldı."}}},{label:"Bakır boruyu kervanla gönder, ekibi riske atma",effects:{copper:-8,rep:{rural:8},order:3},log:"Bakır boru kervanla dağa gönderildi; köy kendi imkânıyla onardı."},{label:"Kendi stoğumuz kışa yetmez, kibarca geri çevir",effects:{copper:3,order:-4,rep:{rural:-9}},log:"Dağ köyüne yardım edilmedi; kooperatifte soğuk bir sessizlik oluştu."}]},{id:"w15_thief",kind:"story",week:16,speaker:"Ambar Bekçisi Nuri",faction:"Mahalle Muhafızları",category:"HIRSIZLIK",avatar:"🔦",portrait:"soldier",text:"Sabah ambarın kilidi kırılmış, iki çuval bulgur ve bir teneke yağ yok. Bekçi Nuri fenerini yakmış: \"Ayak izleri iki ayrı yöne gidiyor. Biri aç bir aile, biri karaborsacı olabilir. Mahalle meclisi senin kararını bekliyor.\"",choices:[{label:"İzleri sür, hırsızı gece yarısı ambar başında yakala",effects:{},dice:{dc:4,success:{effects:{food:8,order:10,copper:3,rep:{guild:6,rural:4}},log:"Hırsız karaborsacı çıktı; çalınan erzak geri alındı ve düzen güçlendi."},fail:{effects:{food:-4,order:-6,rep:{rural:-5}},log:"Kovalamaca karanlıkta sonuçsuz kaldı; ambar ikinci kez soyuldu."}}},{label:"Suçluyu bulmak yerine ambarda adil paylaşım defteri aç",effects:{food:-5,order:8,rep:{rural:10,guild:2}},log:"Ambar defteri açıldı; her hane hakkını gördü ve hırsızlık utancı azaldı."},{label:"Ambara çift kilit ve muhafız nöbeti koy, olayı kapat",effects:{copper:-4,order:5,rep:{guild:4,rural:-4}},log:"Ambar çift kilitlendi; hırsız bulunamadı ama kapılar sağlamlaştı."}]},{id:"w20_springflu",kind:"story",week:20,speaker:"Doktor Leyla",faction:"Mahalle Reviri",category:"SALGIN",avatar:"🤒",portrait:"medic",text:"Bahar sıcaklarıyla birlikte mahallede grip dalgası başladı: ateş, kuru öksürük, halsizlik. Revirde üç yatak kaldı, tıbbi stok ise yarıya indi. Doktor Leyla: \"İlacı harcarsak stok biter; karantina uygularsak tezgahlar durur.\"",choices:[{label:"Tıbbi stoğu seferber et, hastaları revirde tedavi et",effects:{meds:-9,order:8,food:-3,rep:{rural:8,guild:3}},log:"Tıbbi stok harcandı ama salgın iki haftada kontrol altına alındı."},{label:"Mahalleyi ikiye böl, karantina ve maske zorunluluğu ilan et",effects:{order:-7,copper:3,rep:{rural:-6,dock:-3}},log:"Karantina salgını yavaşlattı ama ticaret ve üretim durdu."},{label:"Bitkisel buhar ve kaynatılmış su reçetesiyle idare et",effects:{food:-4,copper:-3,meds:2,order:2},log:"Sera bitkileriyle hazırlanan buhar reçetesi hastaları rahatlattı."}]},{id:"w25_inventor",kind:"story",week:26,speaker:"Mucit Çocuk Kerem",faction:"Atölye Çırakları",category:"YENİ FİKİR",avatar:"💡",portrait:"kid",text:"On üç yaşındaki Kerem, hurda bir bisiklet dinamosu, bakır tel ve teneke parçalarından küçük bir elektrik jeneratörü yapmış. \"Bunu dereye bağlarsak aküleri şarj ederiz\" diyor. Ustalar gülüyor, çocuk ısrar ediyor. Masanın üstünde bir çocuğun hayali ve bir atölyenin alayı var.",choices:[{label:"Kerem'e bir tezgah ve malzeme ver, jeneratörü birlikte dene",effects:{},dice:{dc:4,success:{effects:{copper:-5,spark:12,order:6,rep:{guild:10}},log:"Kerem'in jeneratörü aküyü şarj etti! Atölye çırakları yeni bir yıldız kazandı."},fail:{effects:{copper:-5,order:-3,spark:2,rep:{guild:-2}},log:"Jeneratör ilk denemede yandı; Kerem'in elleri is ama gözleri hâlâ parlak."}}},{label:"Fikri ciddiye al ama önce şemayı iste, sonra karar ver",effects:{spark:6,order:4,rep:{guild:4}},log:"Kerem'in çizimleri arşive girdi; ustalar fikri tartışmaya açtı."},{label:"Çocuk işiyle vakit kaybedemeyiz, tezgaha geri gönder",effects:{copper:2,order:-5,spark:-3,rep:{guild:-6}},log:"Kerem tezgaha döndü ama atölyede kimse konuşmadı."}]}];var F0=[{id:"s_embargo_rural",kind:"random",minWeek:4,maxWeek:58,weight:18,condition:{repMax:{rural:29}},speaker:"Muhtar İlyas",faction:"Kırsal Kooperatif",category:"AMBARGO KRİZİ",avatar:"\uD83D\uDEAB",portrait:"farmer",text:"Kırsal Kooperatif ile ilişkilerimiz kopma noktasına geldi! Köylüler dağ su hattının vanalarını kıstı ve pazara buğday sevkiyatını durdurdu. Muhtar İlyas sert konuşuyor: 'Atölye hep kendine yontuyor, köylüyü unuttunuz!'",choices:[{label:"Acil bakır alet ve saban demiri hibe et, ambargoyu kaldır",effects:{copper:-10,food:6,rep:{rural:16}},log:"Köylere saban demiri hibe edildi; Kırsal Kooperatif ambargosu kalktı."},{label:"Muhafızlarla su vanalarını zorla açtır",effects:{food:8,order:-8,rep:{rural:-8,guild:4}},log:"Su vanaları muhafız zoruyla açıldı; köylerle gerilim tırmandı."},{label:"Kendi sera ve stoklarımızla idare et",effects:{food:-8,order:-4},log:"Köy ambargosu altında zorlu bir hafta geçirildi."}]},{id:"s_embargo_dock",kind:"random",minWeek:6,maxWeek:58,weight:18,condition:{repMax:{dock:29}},speaker:"Kaptan Rıza",faction:"İskele Baronları",category:"LİMAN ABLUKASI",avatar:"⚓",portrait:"captain",text:"İskele Baronları atölyemize liman ablukası ilan etti! Karaborsacılar yedek parça ve mazot akışını kesiyor. Kaptan Rıza haber yollamış: 'Bizimle masaya oturmayan, Marmara'dan bir damla mazot alamaz.'",choices:[{label:"Baronlara motor revizyonu ve 8 bakır teklif et, barış yap",effects:{copper:-8,fuel:5,rep:{dock:16}},log:"Baronların tekneleri onarıldı; liman ablukası sona erdi."},{label:"Karaborsa depolarına gece baskını düzenle",effects:{},dice:{dc:4,success:{effects:{fuel:8,copper:8,order:6,rep:{dock:6}},log:"Gece baskınıyla karaborsa deposu ele geçirildi; Baronlar geri adım attı!"},fail:{effects:{copper:-6,order:-8,rep:{dock:-6}},log:"Baskın pusuya düştü; muhafızlar eli boş döndü."}}},{label:"Deniz ticaretini boşver, iç hatlara yönel",effects:{copper:-6,fuel:-3},log:"Liman ablukası yüzünden yedek parça ve yakıt kaybı yaşandı."}]},{id:"s_synergy_armor_train",kind:"random",minWeek:32,maxWeek:58,weight:20,condition:{tech:"buhar_kazani",flag:"kara_tren",flagNot:"zirhli_lokomotif"},speaker:"Baş Usta Kemal",faction:"Torna Loncası",category:"MÜHENDİSLİK SİNERJİSİ",avatar:"\uD83D\uDE82",portrait:"welder",text:"Atölyedeki Buhar Kazanı ile Gar'daki Kara Tren'in basınç regülatörlerini birleştirecek bir tasarım çıkardık! Lokomotifi çelik levhalarla kaplayıp üzerine yüksek basınçlı buhar topu monte edebiliriz.",choices:[{label:"Projeyi onayla! Zırhlı Buhar Katarını inşa et",effects:{copper:-12,spark:14,order:12,rep:{guild:12}},setFlags:["zirhli_lokomotif"],log:"Mühendislik harikası Zırhlı Buhar Katarı raylara indi!"},{label:"Çeliği ve bakırı verici kulesine sakla, sade katar yeter",effects:{copper:6,spark:8},setFlags:["zirhli_lokomotif"],log:"Kaynaklar doğrudan verici kulesine aktarıldı."}]},{id:"s_overtime_strike",kind:"random",minWeek:5,maxWeek:58,weight:16,condition:{flag:"overtime_fatigue"},speaker:"Usta Başı Kemal",faction:"Torna Loncası",category:"VARDİYA YORGUNLUĞU",avatar:"\u26A0️",portrait:"welder",text:"Üst üste uygulanan çift vardiyalar ustaları ve kalfaları tüketti! Tezgah başında uyuklayan bir çırak az kalsın kayışa kolunu kaptırıyordu. Lonca temsilcileri dinlenme ve sıcak tayın talep ediyor.",choices:[{label:"İki gün ücretli izin ve sıcak et yemeği dağıt",effects:{food:-8,order:12,rep:{guild:10}},log:"Vardiya yorgunluğu ziyafet ve dinlenmeyle giderildi."},{label:"Jeton primleri dağıt, vardiyayı gönüllü tut",effects:{jeton:-2,order:6,spark:6,rep:{guild:6}},log:"Ustalara jeton primi dağıtıldı; üretim aksamadı."},{label:"Sıkıyönetim: verici bitene kadar kimse durmayacak!",effects:{copper:8,spark:6,order:-12,rep:{guild:-10}},log:"Zorunlu mesai devam etti; üretim arttı ama homurtular büyüdü."}]},{id:"r_benzin_kuyrugu",kind:"random",minWeek:1,maxWeek:8,weight:10,speaker:"Gözcü Baran",faction:"Mahalle Muhafızları",category:"KAOS",avatar:"⛽",portrait:"soldier",text:"Çevredeki son çalışan benzin istasyonunda kuyruk kavgaya dönüştü. Pompa mekanik, depoda hâlâ mazot var — ama kalabalık kontrolsüz. İstasyon sahibi yardım için kapıya dayandı.",choices:[{label:"Muhafızları gönder, sırayı silah zoruyla kur",effects:{fuel:8,order:-4,rep:{guild:3}},log:"Benzin istasyonunda zorla sıra kuruldu; mazot payı alındı."},{label:"Lonca ile anlaş: pompayı biz tamir edelim, mazot yarı yarıya",effects:{fuel:6,copper:-3,order:5,rep:{guild:6}},log:"Pompa lonca aracılığıyla paylaşıldı; kimse kıyamadı."},{label:"Bulaşma, kendi depomuzda odun gazı araştırması yap",effects:{spark:3,copper:-2},log:"Kavgaya karışılmadı; odun gazı deneyleri hızlandı."}]},{id:"r_hastane",kind:"random",minWeek:1,maxWeek:10,weight:9,speaker:"Doktor Leyla",faction:"Mahalle Reviri",category:"SAĞLIK",avatar:"⚕️",portrait:"medic",text:"Devlet hastanesinin acil servisi jeneratörünü son kez çalıştırdı. Elimizde bir günlük mazot varsa ilaç depolarını ve ekipmanları tahliye edebiliriz. Mazot verirsen kış boyu yetecek tıbbi stok geliyor.",choices:[{label:"Mazot ver, tüm ecza dolaplarını tahliye et",effects:{fuel:-4,meds:14,order:5,rep:{rural:5}},log:"Hastane ecza depoları boşaltıldı; revir dolup taştı."},{label:"Sadece antibiyotik ve ameliyat takımlarını al",effects:{fuel:-2,meds:8},log:"Kritik ilaçlar ve aletler kurtarıldı."},{label:"Mazot kış içindi — hastane ekibi revire katılsın",effects:{crew:{saglikci:1},order:3,meds:-2},log:"Hastaneden bir hemşire ekibe katıldı."}]},{id:"r_tavuk_ciftligi",kind:"random",minWeek:2,maxWeek:12,weight:9,speaker:"Tavukçu Rıfat",faction:"Kırsal Kooperatif",category:"GIDA",avatar:"\uD83D\uDC14",portrait:"farmer",text:"Yumurta fabrikasının son kanadı: 200 tavuk, yem stoğu tükenmiş. Rıfat tavukları ve kümes panellerini getiriyor; karşılığında atölyeden tel örgü ve su borusu istiyor.",choices:[{label:"Tel örgü ve boru ver, kümesi atölye avlusuna kur",effects:{copper:-6,food:10,crew:{ciftci:1},rep:{rural:6}},log:"Kümes kuruldu; her sabah 40 yumurta mahalleye dağıtılıyor."},{label:"Sadece tavukları al, kümes malzemesini köye sat",effects:{food:6,copper:3},log:"Tavuklar alındı; paneller takasla gitti."},{label:"Tavuk değil tahıl istiyoruz, Rıfat’ı köye gönder",effects:{food:4,rep:{rural:-3}},log:"Rıfat küserek ayrıldı; birkaç gün yumurtasız kaldık."}]},{id:"r_devriye",kind:"random",minWeek:1,maxWeek:10,weight:8,speaker:"Astsubay Oktay",faction:"Dağılan Garnizon",category:"ASKERİ ARTIK",avatar:"\uD83C\uDF96️",portrait:"soldier",text:'Tugay’dan arta kalan bir devriye ekibi mahallenin çevresinde geziyor. Zırfları ve silahları sağlam ama erzakları bitmiş. Astsubay Oktay: "Ya bize katılın ya bizi besleyin. Böyle dağınık kalamayız."',choices:[{label:"Devriyeyi mahalle savunmasına kat",effects:{crew:{muhafiz:1},food:-6,order:8,rep:{rural:-3}},log:"Askeri devriye mahalle nöbetine katıldı; disiplin arttı."},{label:"Sadece bir haftalık erzak ver, yollarına devam etsinler",effects:{food:-4,order:3},log:"Devriye erzağını alıp dağa döndü."},{label:"Silahlarını bizim muhafızlara devretmelerini iste",effects:{copper:6,order:-5,rep:{rural:4}},log:"Silah devri pazarlığı gergin geçti ama tamamlandı."}]},{id:"r_yagmaci_kucuk",kind:"random",minWeek:2,maxWeek:14,weight:8,speaker:"Gözcü Baran",faction:"Mahalle Muhafızları",category:"GÜVENLİK",avatar:"\uD83E\uDE93",portrait:"soldier",text:"Ölü marketin deposunu soyan küçük bir yağmacı grubu yakalandı. İçlerinde üç genç var — açlıktan çalmışlar. Mahallelin bir kısmı ceza, bir kısmı af istiyor.",choices:[{label:"Aç gençleri ekibe kat, kalanları uyarıp sal",effects:{crew:{muhafiz:1},food:-3,order:5,rep:{rural:4}},log:"Üç genç nöbet düzenine katıldı; geri kalanlar affedildi."},{label:"Çalınanları geri al, bir gün boyunca kamuya hizmet yaptır",effects:{food:4,order:7},log:"Yağmacılar gün boyu ambar taşıdı; mallar geri alındı."},{label:"Sert ol: hepsini mahalleden sürgün et",effects:{order:4,food:2,rep:{rural:-6,guild:-3}},log:"Yağmacılar sürüldü; mahalle güvenliği tartışmalı biçimde sağlandı."}]},{id:"r_multeci",kind:"random",minWeek:5,maxWeek:24,weight:10,speaker:"Muhtar İlyas",faction:"Kırsal Kooperatif",category:"MÜLTECİ DALGASI",avatar:"\uD83D\uDC65",portrait:"farmer",text:"İstanbul yürüyüşünden kalan 20 kişilik bir grup mahalle meydanında. İçlerinde iki kaynak ustası, bir ebe ve çocuklar var. Erzak paylaşımı gerginlik yaratıyor ama eller emek, gözler umut.",choices:[{label:"Hepsini kabul et — herkes yer bulur",effects:{crew:{usta:1,saglikci:1},food:-10,order:8,rep:{rural:8}},log:"Mülteci grubu mahalleye yerleşti; yeni eller atölyeye geldi."},{label:"Sadece ustaları ve ebeyi kabul et",effects:{crew:{usta:1},food:-4,order:-4,rep:{rural:-4}},log:"Seçici kabul mahallede tartışma yarattı."},{label:"Erzak yetmez — kapılar kapalı",effects:{food:3,order:-10,rep:{rural:-10,guild:-3}},log:"Mülteciler kapıdan döndü; mahalle vicdanı yaralandı."}]},{id:"r_demirci",kind:"random",minWeek:5,maxWeek:26,weight:8,speaker:"Gezgin Demirci Şahin",faction:"Torna Loncası",category:"USTA",avatar:"\uD83D\uDD28",portrait:"welder",text:'Köy köy gezen demirci Şahin Usta atölyenin dumanını görmüş, uğramış. Örsü, körüğü ve otuz yıllık tecrübesi sırtında. "Bir örs ile yatak verin, size yirmi yıl hizmet edeyim" diyor.',choices:[{label:"Şahin Usta’yı loncaya kat, dökümhaneyi emanet et",effects:{copper:-5,crew:{usta:1},order:4,rep:{guild:8}},log:"Demirci Şahin loncaya katıldı; ocak başı onun oldu."},{label:"Yatak yok ama ortak atölye teklif et",effects:{copper:3,rep:{guild:4}},log:"Şahin Usta günübirlik çalışmalara katılıyor."}]},{id:"r_tohum",kind:"random",minWeek:5,maxWeek:18,weight:8,speaker:"Kurye Defne",faction:"Keşif Ekibi",category:"KEŞİF",avatar:"\uD83C\uDF31",portrait:"scout",text:"Terk edilmiş bir tarım şirketinin deposunda mühürlü tohumluk çuvalları bulduk: buğday, arpa, fasulye. Çuvalların yarısı küflenmiş ama kalanı bir dönümlük altın değerinde.",choices:[{label:"Tohumlukları köylere dağıt, ortak ekim yap",effects:{food:8,rep:{rural:12}},log:"Tohumluk köylere dağıtıldı; ortak ekim anlaşması yapıldı.",followUp:"fu_tohum"},{label:"Atölye ambârında sakla, bahara kadar kuru tut",effects:{food:3,order:-3},log:"Tohumluk ambara kilitlendi; köylüler pay istiyor.",followUp:"fu_tohum"}]},{id:"r_bal",kind:"random",minWeek:6,maxWeek:24,weight:7,speaker:"Arıcı Sıtkı",faction:"Kırsal Kooperatif",category:"TAKAS",avatar:"\uD83C\uDF6F",portrait:"farmer",text:"Dağdaki kovanlardan ilk hasat: petek petek bal ve balmumu. Bal yaralar için, balmumu kablo yalıtımı için — ikisi de kıvılcım projesinin nabzı. Sıtkı takasta ısrarcı.",choices:[{label:"Balmumunu verici kablolarına al",effects:{food:-3,spark:6,rep:{rural:5}},log:"Balmumu yalıtımıyla verici kabloları sağlamlaştı."},{label:"Balı revire ve çocuklara al",effects:{copper:-3,food:5,meds:4,order:4},log:"Bal revire gitti; çocuklar ilk kez gülümsedi."},{label:"İkisinin yarısını al, kalanını ertesi hasada bağla",effects:{spark:3,food:3,rep:{rural:3}},log:"Bal ve balmumu yarı yarıya paylaşıldı."}]},{id:"r_yangin",kind:"random",minWeek:5,maxWeek:40,weight:7,speaker:"Baş Usta Kemal",faction:"Torna Loncası",category:"KAZA!",avatar:"\uD83D\uDE92",portrait:"welder",text:"Kesme masasından sıçranan kıvılcım talaş yığınını tutuşturdu! Alevler odun stokuna doğru ilerliyor. Yangın hortumu yok — kova zinciri, kum ve halat var.",choices:[{label:"Herkes yangına! Kova zinciri kur",effects:{food:-3,copper:-6,order:6},log:"Kova zinciri yangını söndürdü; hasar sınırlı kaldı."},{label:"Önce gaz ve yakıt bidonlarını uzaklaştır",effects:{fuel:-3,copper:-3,order:8,spark:2},log:"Bidonlar kurtarıldı; yangın deposuz kaldı, söndü."},{label:"Makine hattını elektrikle kes, sanayi yangın kapısını kapat",effects:{copper:-9,order:3,spark:-3},log:"Yangın kapısı kapanarak yangın izole edildi; tezgah zarar gördü."}]},{id:"r_kalfa_okulu",kind:"random",minWeek:8,maxWeek:30,weight:7,speaker:"Araştırmacı Emre",faction:"Üniversite Ekibi",category:"EĞİTİM",avatar:"\uD83C\uDF93",portrait:"scholar",text:"Emre’nin kurduğu akşam kursunda üç çırak torna ve ölçme derslerini bitirdi. Kalfa yeminleri için gelenek gereği bir ziyafet ve yeni takım çantası gerekiyor.",choices:[{label:"Ziyafet ver ve takım çantalarını hediye et",effects:{food:-6,copper:-4,crew:{usta:1},order:6,rep:{guild:6}},log:"Üç çırak kalfa oldu! Lonca gençleşti."},{label:"Sadece belge ver, ziyafeti ertele",effects:{order:-2,crew:{usta:1}},log:"Kalfalar belgelerini aldı; kutlama sade geçti."},{label:"Kursu askıya al, herkes üretime dönsün",effects:{copper:4,order:-4,rep:{guild:-5}},log:"Kurs kapandı; çıraklar yarım kaldı."}]},{id:"r_kuyu",kind:"random",minWeek:6,maxWeek:28,weight:7,speaker:"Muhtar İlyas",faction:"Kırsal Kooperatif",category:"ALTYAPI",avatar:"⛲",portrait:"farmer",text:"Meydandaki eski kuyu yeniden açıldı ama su tuzlu ve kireçli. İçilebilir hale getirmek için ya derin kazanma ya damıtma imbikleri gerekiyor. Mahalle su tartışması büyüyor.",choices:[{label:"Bakır imbiklerle damıtma düzeneği kur",effects:{copper:-7,food:6,order:5},log:"Damıtma imbikleri kuruldu; kuyu suyu içilebilir hale geldi."},{label:"Kuyuyu 10 metre derinleştir",effects:{fuel:-3,food:8,rep:{rural:5}},log:"Kuyu derinleştirildi; tatlı damara ulaşıldı."},{label:"Dağ hattına konsantre ol, kuyuyu kapat",effects:{order:-3,copper:2},log:"Kuyu kapatıldı; su tek kaynağa bağlandı (riskli)."}]},{id:"r_at_ekibi",kind:"random",minWeek:7,maxWeek:30,weight:6,speaker:"Kurye Defne",faction:"Keşif Ekibi",category:"ULAŞIM",avatar:"\uD83D\uDC0E",portrait:"scout",text:"Çiftlikten iki at ve bir kombo alabilmişiz. Yakıt gerektirmeyen, yemle çalışan ulaşım! Atölye ile köyler arası posta ve yük hattı kurulabilir.",choices:[{label:"At ekibiyle posta ve yük hattı kur",effects:{copper:-5,food:5,order:6,rep:{rural:8,guild:4}},log:"At arabası posta hattı açıldı; köylerle bağlantı hızlandı."},{label:"Atları tarlaya koş, traktör tasarrufu yap",effects:{food:8,rep:{rural:5}},log:"Atlar pulluğa koşuldu; mazot tasarrufu başladı."},{label:"Atları İskele Baronları’na sat",effects:{copper:8,rep:{dock:6,rural:-8}},log:"Atlar Baronlara satıldı; köylüler küstü."}]},{id:"r_sarhos_nobetci",kind:"random",minWeek:8,maxWeek:34,weight:6,speaker:"Gözcü Baran",faction:"Mahalle Muhafızları",category:"İÇ DİSİPLİN",avatar:"\uD83C\uDF7A",portrait:"soldier",text:"Gece nöbetçisi içkili olarak nöbet yerinde yakalandı; kapı barikatını açık bırakmış. Sabaha kadar kimse fark etmemiş. Şimdi disiplin sorunu — mahalle meclisi kararı bekliyor.",choices:[{label:"Nöbetten men et, gündüz işçi olarak çalıştır",effects:{order:6,rep:{rural:-2}},log:"Nöbetçi gündüz vardiyasına verildi; adalet sağlandı."},{label:"Herkes aynı hizada: bir hafta ambar nöbeti",effects:{order:8,food:-2},log:"Cezalar eşit dağıtıldı; mesaj netleşti."},{label:"Görmezden gel, adam iyi bir usta",effects:{order:-6,rep:{guild:3}},log:"Olay kapatıldı ama nöbet disiplini gevşedi."}]},{id:"r_tuz_kervani",kind:"random",minWeek:10,maxWeek:34,weight:6,speaker:"Kaptan Rıza",faction:"İskele Baronları",category:"TİCARET",avatar:"\uD83E\uDDC2",portrait:"captain",text:"Baronların tuz kervanı yola çıkıyor; gidiş dönüş iki hafta. Konteynırlarında yer var — gidersek tuz, baharat ve galvaniz sac ile döneriz. Ama gemi adamları yük paylaşımında sert pazarlık eder.",choices:[{label:"Kervana katıl, yarım konteynır yer al",effects:{food:8,copper:-4,meds:3,rep:{dock:6}},log:"Tuz kervanıyla takas yapıldı; ambarlar renklendi."},{label:"Sadece tuz al, geri kalan yeri Baronlara bırak",effects:{food:4,rep:{dock:8}},log:"Tuz stoğu tamamlandı; Baronlar memnun."},{label:"Denize çıkmak riskli, kervanı bekle",effects:{order:-2},log:"Kervan kaçırıldı; mutfakta tuz kıtlığı var."}]},{id:"r_bakir_hirsizi",kind:"random",minWeek:9,maxWeek:36,weight:6,speaker:"Baş Usta Kemal",faction:"Torna Loncası",category:"HIRSIZLIK",avatar:"\uD83D\uDD75️",portrait:"welder",text:"Sahil deposundan bakır kablo demetleri çalınmış. İz, komşu mahallenin teneke mahallesine düşüyor. Ya teşebbüs edip geri alırız ya da jandarma yerine kendi anlaşmamızı yaparız.",choices:[{label:"Muhafızlarla sessiz operasyon: bakırı geri al",effects:{copper:6,order:3,rep:{dock:-5}},log:"Bakır geri alındı; teneke mahalleyle gerginlik başladı."},{label:"Teneke mahalleyle anlaş: iş karşılığı bakır",effects:{copper:-2,crew:{usta:1},order:5,rep:{dock:4}},log:"Teneke mahalleden iki çırak işe alındı; mesele çözüldü."},{label:"Kilitleri ve köpekleri artır, mesele kapansın",effects:{copper:-4,order:2},log:"Depo güvenliği artırıldı; kayıp telafsiz kapandı."}]},{id:"r_zaturre",kind:"random",minWeek:25,maxWeek:46,weight:9,speaker:"Doktor Leyla",faction:"Mahalle Reviri",category:"SALGIN",avatar:"\uD83E\uDD12",portrait:"medic",text:"Soğuklar çocuklarda zatürreyi tetikledi; revirde altı yatak dolu. Antibiyotik stoğu erimekte, göğüs pompaları ve buhar inhalasyonu için ekipman gerekiyor.",choices:[{label:"Tıbbi stoğu seferber et, inhalasyon odası kur",effects:{meds:-8,order:8,rep:{rural:6}},log:"İnhalasyon odası kuruldu; çocuklar toparlandı."},{label:"İskele Baronları’ndan acil antibiyotik ithal et",effects:{copper:-8,meds:8,rep:{dock:4}},log:"Antibiyotik kervanı revire ulaştı."},{label:"Karantina ve bitki çaylarıyla idare et",effects:{order:-8,meds:2,rep:{rural:-5}},log:"Salgın ev ilaçlarıyla kontrol altına çalışıldı; moral bozuk."}]},{id:"r_kondansator",kind:"random",minWeek:27,maxWeek:46,weight:8,speaker:"Telsizci Zehra",faction:"Atölye Verici Odası",category:"HURDA AVI",avatar:"\uD83D\uDD0C",portrait:"medic",text:"Eski bir tramvay deposunda mika kondansatör ve bakır şerit stoku bulundu. Vericinin güç katı için tam ihtiyacımız olan şey — ama depo kar altında ve çatısı çökmek üzere.",choices:[{label:"Depoya keşif: kondansatörleri çıkar",effects:{spark:8,fuel:-2},log:"Mika kondansatörler verici güç katına monte edildi."},{label:"Çatı riski fazla; depoyu bahara ertele",effects:{order:2},log:"Tramvay deposu bahar listesine eklendi."}]},{id:"r_29ekim",kind:"random",minWeek:41,maxWeek:43,weight:10,speaker:"Öğretmen Nazlı",faction:"Mahalle Mektebi",category:"29 EKİM",avatar:"\uD83C\uDDF9\uD83C\uDDF7",portrait:"scholar",text:'Takvimler 29 Ekim’i gösteriyor. Çocuklar mektepte marş söylüyor, meydanda bayrak çekilecek. Nazlı Öğretmen: "Bu kışta bile Cumhuriyet’i kutlarız. İnsanlar bir şeye ihtiyaç duyuyor: bir arada olmaya."',choices:[{label:"Meydanda fener alayı ve ortak yemek düzenle",effects:{food:-5,order:14,spark:3,rep:{rural:6,guild:4,dock:4}},log:"29 Ekim fener alayı yapıldı; mahalle tek yürek oldu."},{label:"Atölyede madeni bando düdükleri üret",effects:{copper:-3,order:9,rep:{guild:5}},log:"Lonca bandosu meydanda ilk konserini verdi!"},{label:"Erzak israfı olmaz, kutlama evlerde",effects:{food:2,order:-5},log:"Bayram evlerde sade geçti; meydan boş kaldı."}]},{id:"r_buz_yolu",kind:"random",minWeek:33,maxWeek:44,weight:7,speaker:"Kurye Defne",faction:"Keşif Ekibi",category:"KIŞ YOLU",avatar:"\uD83D\uDEF7",portrait:"scout",text:"Dondurucu soğuk bir fırsat sundu: gölet dondu, kızaklarla eski gar raylarının üzerinden ağırlık taşıyabiliriz. Ray üstü buz, çamurdan çok daha hızlı.",choices:[{label:"Kızak kervanını raylara kur",effects:{fuel:-2,copper:9,order:3},log:"Buz raylarında kızak kervanı işledi; hurda deposu doldu."},{label:"Kızaklarla köylere gıda taşı",effects:{fuel:-1,food:6,rep:{rural:6}},log:"Kızak kervanı köylere erzak ulaştırdı."},{label:"Riskli — kızaklar bahara kalsın",effects:{order:-2},log:"Buz yolu fırsatı değerlendirilmedi."}]},{id:"r_anksiyete",kind:"random",minWeek:30,maxWeek:46,weight:7,speaker:"Öğretmen Nazlı",faction:"Mahalle Mektebi",category:"MORAL",avatar:"\uD83C\uDFAD",portrait:"scholar",text:"Uzun kış, karanlık akşamlar ve belirsizlik morali yedi. Muhafızlar yorgun, çocuklar sessiz, ustalar hırçın. Nazlı Öğretmen bir şeyler yapılması için yalvarıyor.",choices:[{label:"Atölyede halk tiyatrosu ve müzik akşamı düzenle",effects:{food:-3,order:11,rep:{rural:4,guild:3}},log:"Tiyatro akşamı buzları eritti; kahkahalar geri döndü."},{label:"Ekstra tayın ve çay dağıtımı ilan et",effects:{food:-6,order:8},log:"Sıcak çay ve ekstra tayın moral getirdi."},{label:"Çalışma disiplinini artır, boş vakti üretimle doldur",effects:{copper:5,order:-7},log:"Üretim arttı ama yüzler asıldı."}]},{id:"r_kayip_konvoy",kind:"random",minWeek:34,maxWeek:46,weight:6,speaker:"Kaptan Rıza",faction:"İskele Baronları",category:"DENİZ FACİASI",avatar:"\uD83C\uDF0A",portrait:"captain",text:'Baronların son kervanı fırtınaya yakalandı; iki tekne battı, kurtulanlar donmuş halde kıyıya vurdu. Baron Rıza: "Depomuz boş, adamlarımız öldü. Yardım edersen borcumuz ödenmez ama unutulmaz."',choices:[{label:"Reviri ve sıcak yemekle kurtulanları ağırla",effects:{food:-6,meds:-4,rep:{dock:14},order:6},log:"Boğulan denizcilerin yerine kurtulanlar ağırlandı; Baronlar minnettar."},{label:"Odun ve branda gönder, kendileri idare etsin",effects:{fuel:-3,rep:{dock:6}},log:"Baronlara malzeme yardımı yapıldı."},{label:"Denizcilere yatacak yer yok",effects:{rep:{dock:-12},order:-4},log:"Baronlar küs döndü; liman kapıları daraldı."}]},{id:"r_yilbasi",kind:"random",minWeek:47,maxWeek:48,weight:12,speaker:"Öğretmen Nazlı",faction:"Mahalle Mektebi",category:"YILBAŞI ÇANI",avatar:"\uD83D\uDD14",portrait:"scholar",text:"Yıl dönüyor. Mor Gece’den bu yana ilk yeni yıl. Kilise çanı ve cami hoparlörü aynı anda — herkes meydanda. Geçen yıl ekranlar karardı; bu yıl insanlar aydınlanıyor. Bir gelenek başlatmak için son şans.",choices:[{label:"Yılbaşı çanını kaydet: her mahalle kendi çanını çalsın",effects:{order:14,spark:4,rep:{rural:5,guild:4,dock:4}},log:"Yılbaşı çanı geleneği başladı; umut bir yıl daha taşıdı."},{label:'Vericiye özgü: gece yarısı Mors ile "YENİ YIL" yayını',effects:{spark:8,order:8,rep:{guild:6}},log:"Gece yarısı Mors yayınıyla yıl değişti; Ankara dinledi."},{label:"Kutlama israf; sessiz girilsin",effects:{food:2,order:-6},log:"Yıl sessizce girdi; meydan boştu."}]},{id:"r_vana",kind:"random",minWeek:26,maxWeek:44,weight:6,speaker:"Mühendis Selin",faction:"Torna Loncası",category:"BAKIM",avatar:"\uD83D\uDD27",portrait:"scout",text:"Su çarkının ana rulmanı kızarmaya başladı; sıcak yağ kokusu veriyor. İki seçenek var: hemen durdurup haftalarca süren revizyon ya da gres basarak son sürat devam.",choices:[{label:"Durdur ve revizyona al (üretim düşer ama güvenli)",effects:{spark:-5,order:4,copper:-3},log:"Su çarkı revizyona alındı; kazasız atlatıldı."},{label:"Gresle devam et, gece vardiyasında kontrol et",effects:{spark:4,order:-4},log:"Çark gresle dönme
