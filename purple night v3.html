<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOR GECE: Mekanik Rönesans — 2D Strateji & Karar Oyunu (v4.0 İleri Seviye Sürüm)</title>
<meta name="description" content="Mor Gece EMP fırtınası dünyayı sildi. Güney Marmara'daki mekanik atölyenden ilk yılı yönet: lojistik çöküşü, takas düzeni, ilk kış ve Ankara'ya ulaşan ilk sinyal.">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:#0b0d11;color:#e5e7eb;
  overflow-x:hidden;-webkit-user-select:none;user-select:none}
.mono{font-family:'JetBrains Mono','Cascadia Mono',ui-monospace,Consolas,monospace}
.brass{border:1px solid rgba(217,119,6,.35);box-shadow:inset 0 1px 0 rgba(251,191,36,.12),0 8px 24px rgba(0,0,0,.6)}
.panel{border-radius:12px;background:#141821;padding:10px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input{font:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#11141c}
::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}

/* renk yardımcıları */
.amber{color:#fbbf24}.green{color:#34d399}.rose{color:#fb7185}.purple{color:#c084fc}
.sky{color:#38bdf8}.cyan{color:#22d3ee}.yellow{color:#facc15}.orange{color:#fb923c}
.dim{color:#94a3b8}.sm{font-size:11px}.b{font-weight:700}.center{text-align:center}
.c-green{color:#6ee7b7}.c-amber{color:#fcd34d}.c-sky{color:#7dd3fc}.c-purple{color:#d8b4fe}

/* butonlar */
.btn{border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;transition:all .15s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn.primary{background:#f59e0b;color:#1e1300;box-shadow:0 6px 18px rgba(245,158,11,.25)}
.btn.primary:hover{background:#fbbf24}
.btn.purple{background:#7c3aed44;border-color:#a855f7aa;color:#ddd6fe}
.btn.purple:hover{background:#7c3aed66}
.btn.ghost{background:#1c212b;border-color:#3f4756;color:#e2e8f0;font-size:12px;font-weight:600}
.btn.ghost:hover{background:#283040}
.btn.danger{background:#881337cc;border-color:#9f1239aa;color:#fecdd3;font-size:12px;font-weight:600}
.btn.danger:hover{background:#9f1239}
.btn.green{background:#065f46cc;border-color:#10b98188;color:#a7f3d0;font-size:12px;font-weight:700}
.btn.green:hover{background:#047857}
.btn.cyan{background:#164e63cc;border-color:#22d3ee88;color:#a5f3fc;font-weight:700;font-size:12px}
.btn.cyan:hover{background:#155e75}
.btn.sm{padding:6px 10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* başlık ekranı */
.aurora-bg{position:relative;overflow:hidden;background:#090b12;min-height:100vh}
.aurora-bg::before,.aurora-bg::after{content:'';position:absolute;inset:-40%;pointer-events:none;
  background:radial-gradient(ellipse 35% 28% at 30% 35%,rgba(147,51,234,.22),transparent 65%),
  radial-gradient(ellipse 30% 24% at 70% 30%,rgba(59,130,246,.14),transparent 65%),
  radial-gradient(ellipse 32% 26% at 55% 65%,rgba(16,185,129,.12),transparent 65%);
  animation:aur 16s ease-in-out infinite alternate}
.aurora-bg::after{animation-duration:23s;animation-direction:alternate-reverse;opacity:.7}
@keyframes aur{from{transform:translate(-4%,-3%) rotate(-2deg) scale(1.02)}to{transform:translate(4%,3%) rotate(2deg) scale(1.08)}}
.glow{text-shadow:0 0 18px rgba(168,85,247,.45),0 0 42px rgba(217,119,6,.25)}
.flick{animation:flick 3.4s linear infinite}
@keyframes flick{0%,100%{opacity:1}3%{opacity:.82}6%{opacity:1}42%{opacity:.94}44%{opacity:1}71%{opacity:.88}73%{opacity:1}}
.enter{animation:slidein .28s cubic-bezier(.16,1,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.title-wrap{display:flex;align-items:center;justify-content:center;padding:28px 14px}
.title-inner,.origin-inner,.pro-inner{position:relative;z-index:10;width:100%;max-width:720px;text-align:center}
.kicker{font-size:11px;color:#c4b5fdcc;letter-spacing:.35em;text-transform:uppercase;margin-bottom:8px}
h1.glow{font-size:52px;font-weight:900;letter-spacing:-.02em;color:#fde68a}
h1.glow.sm{font-size:30px}
@media(max-width:640px){h1.glow{font-size:38px}}
.sub{font-size:22px;font-weight:700;color:#ddd6fe;margin-bottom:6px}
h1.glow.sm{margin-bottom:4px}
.lead{color:#94a3b8;font-size:14px;line-height:1.6;max-width:540px;margin:0 auto 22px}
.title-btns{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:0 auto}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.title-meta{margin-top:22px;font-size:11px;color:#64748b}
.lead{margin-bottom:10px}
.sect{font-size:11px;letter-spacing:.2em;margin:18px 0 8px;text-align:left}
.sect.purple{color:#c4b5fd}.sect.rose{color:#fda4af}

/* köken kartları */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left}
@media(max-width:760px){.cards3{grid-template-columns:1fr}}
.ocard,.dcard{border:2px solid #334155;background:#131720;border-radius:14px;padding:12px;transition:all .15s;text-align:left}
.ocard:hover,.dcard:hover{border-color:#b4530988}
.ocard.sel{border-color:#f59e0bcc;background:#1c1508;box-shadow:0 8px 22px rgba(245,158,11,.15)}
.dcard.sel{border-color:#f43f5ecc;background:#1c0f12;box-shadow:0 8px 22px rgba(244,63,94,.15)}
.orow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.oicon{font-size:22px}.oname{font-weight:700;font-size:14px}
.otag{font-style:italic;color:#64748b;font-size:11px;margin-bottom:6px}
.odesc{color:#94a3b8;font-size:11px;line-height:1.5}
.omods{list-style:none;margin-top:8px}
.omods li{color:#6ee7b7;font-size:11px}
.dname{font-weight:700;font-size:12px;margin-bottom:4px}

/* prolog */
.dots{display:flex;justify-content:center;gap:8px;margin:10px 0 14px}
.pdot{width:12px;height:6px;border-radius:99px;background:#334155;transition:all .3s}
.pdot.done{background:#10b981}
.pdot.cur{width:32px;background:#fbbf24}
.stamp{font-size:34px;font-weight:800;color:#fde68a;margin-bottom:16px}
.pcard{background:#12151eee;border-radius:16px;padding:22px;text-align:left;backdrop-filter:blur(6px)}
.pcard-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pav{font-size:24px}.pname{font-weight:700;color:#fde68a;font-size:14px}
.ptext{color:#e2e8f0;font-size:15px;line-height:1.7;margin-bottom:18px}
.pchoices{display:flex;flex-direction:column;gap:10px}
.pro-inner{max-width:640px}

/* seçim butonları (oyun + prolog) */
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:12px;
  background:#151a24e6;border:1px solid #334155;transition:all .15s}
.choice:hover{background:#2a1c0a;border-color:#f59e0b99}
.cnum{flex-shrink:0;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:#242c3a;color:#fbbf24;border:1px solid #3f4756;margin-top:1px}
.choice:hover .cnum{background:#f59e0b;color:#1e1300}
.clabel{font-size:13px;color:#e2e8f0;line-height:1.45}
.choice:hover .clabel{color:#fde68a}
.choice.locked{opacity:.6;cursor:not-allowed;background:#111520}
.lock{color:#fda4afcc;font-size:11px;margin-top:4px}
.cpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:11px;font-weight:700}
.pill.up{color:#6ee7b7}.pill.down{color:#fda4af}
.pill.rep{color:#fcd34d}.pill.crew{color:#7dd3fc}.pill.map{color:#f0abfc}
.kbd-hint{font-size:11px;text-align:right;color:#64748b;margin-top:8px}

/* oyun düzeni */
.gamewrap{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;
  flex-wrap:wrap;padding:10px 16px;background:#11141bee;border-bottom:1px solid #78350f66;backdrop-filter:blur(8px)}
.tb-brand{display:flex;align-items:center;gap:10px;min-width:0}
.tb-gear{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;
  background:#f59e0b26;border:1px solid #f59e0b66;color:#fbbf24;font-weight:800}
.tb-title{font-weight:800;font-size:14px;color:#fde68a;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb-sub{font-size:11px;color:#94a3b8}
.tb-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;padding:5px 10px;border-radius:8px;background:#1c212b;border:1px solid #3f4756;color:#e2e8f0}
.chip.amber{border-color:#b45309aa;color:#fbbf24}
.badge{font-size:10px;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:#2e1065e6;color:#c4b5fd;border:1px solid #6d28d9aa;white-space:nowrap}
.badge.own{background:#052e16;color:#6ee7b7;border-color:#10b98177}
.badge.cost{background:#451a05;color:#fbbf24;border-color:#b4530977}
.badge.nore{background:#4c0519;color:#fda4af;border-color:#9f123977}
.badge.vic{background:#052e16;color:#6ee7b7;border-color:#10b98177}
.badge.fail{background:#4c0519;color:#fda4af;border-color:#9f123977}

/* göstergeler */
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:1240px;width:100%;margin:14px auto 0;padding:0 16px}
@media(max-width:960px){.gauges{grid-template-columns:repeat(2,1fr)}}
.gaugeline{grid-column:1/-1;font-size:11px;color:#64748b}
.gauge{border-radius:12px;background:#141821;padding:10px}
.gauge.warn{animation:pw 1.6s infinite}
@keyframes pw{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,0)}50%{box-shadow:0 0 14px 2px rgba(244,63,94,.35)}}
.ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.gname{font-size:12px;font-weight:700}
.gval{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;opacity:0;transition:all .2s}
.dot.show{opacity:1}
.dot.up{background:#6ee7b7}.dot.down{background:#fda4af}
.dot.small{transform:scale(1.25)}.dot.big{transform:scale(1.65)}
.bar{height:10px;background:#0f172a;border:1px solid #1e293b;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.g-food{background:linear-gradient(90deg,#059669,#2dd4bf)}
.g-copper{background:linear-gradient(90deg,#d97706,#facc15)}
.g-order{background:linear-gradient(90deg,#0369a1,#22d3ee)}
.g-spark{background:linear-gradient(90deg,#9333ea,#d946ef,#fcd34d)}
.ghint{font-size:11px;color:#64748b;margin-top:6px}

/* ana grid */
.grid12{display:grid;grid-template-columns:7fr 5fr;gap:16px;max-width:1240px;width:100%;margin:14px auto;padding:0 16px;flex:1;align-items:stretch}
@media(max-width:1020px){.grid12{grid-template-columns:1fr}}
.col7,.col5{display:flex;flex-direction:column;gap:10px;min-width:0}
.scenebox{padding:10px;display:flex}
.scene{position:relative;width:100%;min-height:300px;height:clamp(300px,42vh,380px);border-radius:12px;overflow:hidden;background:#090b10;border:1px solid #1e293b}
@media(max-width:1020px){.scene{height:56vw;min-height:240px}}
.scanvas{width:100%;height:100%;display:block;cursor:pointer}
.scene-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.sc-toast{transition:opacity .3s;opacity:0;max-width:65%;text-align:right}

/* aksiyon butonları */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.actions{grid-template-columns:repeat(2,1fr)}}
.abtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:12px;
  background:#131720;border:1px solid #33415588;transition:all .15s}
.abtn:hover{background:#1c212b}
.abtn.ok{border-color:#22d3ee66}
#aMorse.ok{border-color:#a855f799}
.ai{font-size:22px}.abtn:hover .ai{transform:scale(1.1)}
.al{font-size:11px;font-weight:700;color:#cbd5e1}
#aTech .al{color:#fcd34d}#aMap .al{color:#a5f3fc}#aTrade .al{color:#6ee7b7}#aMorse .al{color:#d8b4fe}

/* mürettebat + kronik */
.crewbox .crewhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.crewhead h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.crewgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media(max-width:640px){.crewgrid{grid-template-columns:repeat(2,1fr)}}
.crewtile{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#0f172aee;border:1px solid #1e293b;border-radius:8px;padding:6px 8px;font-size:11px;color:#cbd5e1}
.crewtile b{color:#fde68a;font-size:14px}
.reprow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid #1e293b;font-size:11px}
.rep{padding:3px 8px;border-radius:6px;background:#1c212b;border:1px solid #3f4756}
.rep.hi{color:#6ee7b7;border-color:#10b98166}
.rep.mid{color:#e2e8f0}
.rep.lo{color:#fda4af;border-color:#be123c66}
.chron{display:flex;flex-direction:column;min-height:120px}
.chron-head{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px}
.clist{max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;font-size:12px;color:#cbd5e1;padding-right:4px}
.lrow{border-left:3px solid #475569;padding:2px 8px}
.l-decision{border-color:#f59e0b}.l-tech{border-color:#10b981}.l-exp{border-color:#06b6d4}
.l-trade{border-color:#eab308}.l-warn{border-color:#f43f5e}.l-morse{border-color:#a855f7}

/* olay kartı */
.ecard{display:flex;flex-direction:column;gap:12px;flex:1}
.ehead{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid #1e293b}
.eav{width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;
  border-radius:10px;background:#f59e0b1a;border:1px solid #f59e0b66}
.ename{font-weight:800;font-size:14px;color:#fde68a}
.tag{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:6px;background:#1c212b;border:1px solid #3f4756;color:#cbd5e1;white-space:nowrap}
.etext{color:#e2e8f0;font-size:14px;line-height:1.7}
.echoices{display:flex;flex-direction:column;gap:10px;margin-top:auto}

/* alt bilgi */
.foot{margin-top:auto;border-top:1px solid #1e293b;background:#0d1017;padding:10px 16px;
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px}
@media(max-width:720px){.foot span:last-child{display:none}}

/* faz tanıtımı */
.phase{position:fixed;inset:0;z-index:50;background:#000000ec;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.phase-in{max-width:640px;width:100%;text-align:center}
.phase-icon{font-size:56px;margin-bottom:12px}
.phase h2{font-size:17px;color:#fde68a;line-height:1.6;margin-bottom:18px}
.phase-texts{text-align:left;background:#12151eee;border-radius:14px;padding:20px;margin-bottom:22px}
.phase-texts p{color:#cbd5e1;font-size:14px;line-height:1.7;margin-bottom:10px}
.phase-texts p:last-child{margin-bottom:0}

/* modallar */
.overlay{position:fixed;inset:0;z-index:40;background:#000000c4;backdrop-filter:blur(6px);display:none;
  align-items:center;justify-content:center;padding:14px}
.overlay.open{display:flex}
.mbox{background:#141822;border-radius:16px;padding:18px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto}
.mbox.lg{max-width:760px}
.mbox.center{text-align:center}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #1e293b}
.mtitle{font-weight:800;font-size:15px;color:#fbbf24}
.mtitle.green{color:#6ee7b7}
.mhint{color:#94a3b8;font-size:12px;line-height:1.6;margin-bottom:12px}
.signalbox{background:#000000b3;border:1px solid #78350f88;border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px}
.signalbox .dim{color:#64748b;margin-bottom:4px}
.signalbox .raw{color:#fbbf24;letter-spacing:.3em;font-weight:700;word-break:break-all}
.signalbox .dec{color:#6ee7b7;margin-top:4px}

/* mors */
.tiles{display:flex;flex-wrap:wrap;gap:6px;background:#0f172acc;border:1px solid #334155;border-radius:10px;padding:10px;margin-bottom:12px}
.mtile{min-width:52px;text-align:center;border-radius:8px;padding:6px 8px;background:#151a24;border:1px solid #334155}
.mtile.done{background:#052e16;border-color:#10b98177}
.mtile.cur{background:#2a1c0a;border-color:#f59e0bcc;animation:flick 3.4s linear infinite}
.mch{font-size:15px;font-weight:800;color:#e2e8f0}
.mtile.done .mch{color:#6ee7b7}.mtile.cur .mch{color:#fbbf24}
.mcode{font-size:11px;color:#94a3b8;letter-spacing:.2em}
.msent{font-size:11px;color:#7dd3fc;min-height:15px;letter-spacing:.2em}
.mkey{width:100%;height:96px;border-radius:16px;border:4px solid #b4530999;background:#78350f55;color:#fde68a;
  font-weight:800;font-size:17px;font-family:'JetBrains Mono',monospace;transition:transform .08s;touch-action:none;user-select:none}
.mkey:hover{background:#78350f77}
.mkey.pressing{background:#fbbf24;border-color:#fde68a;color:#1e1300;transform:scale(.97);box-shadow:0 0 30px rgba(251,191,36,.5)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.big{font-size:44px;margin:8px 0}

/* teknoloji modalı */
.techwrap{display:flex;flex-direction:column;gap:14px}
.techcat h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.techgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:720px){.techgrid{grid-template-columns:1fr}}
.tcard{text-align:left;border-radius:10px;padding:10px;border:1px solid #334155;background:#0f172aee;transition:all .15s}
.tcard:not([disabled]):hover{background:#1c212b;border-color:#f59e0b99}
.tcard.owned{background:#052e1699;border-color:#10b98177}
.tcard.reqlock{opacity:.6;cursor:not-allowed}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tname{font-size:12px;font-weight:700;color:#e2e8f0}
.tdesc{color:#94a3b8;font-size:11px;line-height:1.5;margin:6px 0 4px}
.teff{color:#6ee7b7cc;font-size:11px}
.treq{color:#fda4af;font-size:11px;margin-top:4px}

/* harita modalı */
.mapbox{border-radius:12px;overflow:hidden;border:1px solid #33415588;background:#0d1117;margin-bottom:12px}
.mapbox svg{display:block;width:100%;height:auto;user-select:none}
.mapnode{cursor:pointer}
.locdetail{background:#0f172aee;border:1px solid #334155;border-radius:12px;padding:12px}
.locrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.locrow h4{color:#a5f3fc;font-size:14px;margin-bottom:4px}
.locline{display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid #1e293b;margin-top:10px;padding-top:8px;font-size:11px}
.expr{margin-top:10px;background:#2a1c0acc;border:1px solid #b4530988;border-radius:8px;padding:8px;font-size:11px}

/* takas modalı */
.tradelist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.trow2{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0f172aee;border:1px solid #334155;border-radius:12px;padding:12px}
.tlabel{color:#e2e8f0;font-size:13px;margin:2px 0}
.pad{padding:22px 0}
.reclist{display:flex;flex-direction:column;gap:6px}
.recrow{display:flex;align-items:center;gap:10px;background:#0f172aee;border:1px solid #334155;border-radius:10px;padding:8px 10px;font-size:12px}
.recrow.top1{background:#2a1c0acc;border-color:#b45309aa}
.recrow>div{flex:1;min-width:0}
.recrow .b{color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* rehber */
.helpbody{font-size:13px;color:#cbd5e1;line-height:1.7}
.helpbody p{margin-bottom:10px}
.hlist{list-style:none;margin-bottom:10px}
.hlist li{padding-left:16px;position:relative;margin-bottom:6px}
.hlist li::before{content:'•';position:absolute;left:2px;color:#f59e0b}
.achwrap{border-top:1px solid #1e293b;padding-top:10px;margin-top:6px}
.achwrap h4{font-size:12px;margin-bottom:8px}
.achgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media(max-width:640px){.achgrid{grid-template-columns:1fr}}
.achcard{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:#0f172a66;border:1px solid #1e293b;color:#64748b}
.achcard.on{background:#2a1c0abb;border-color:#b45309aa;color:#fde68a}
.achcard span{font-size:18px}
.achcard .b{font-weight:700;font-size:12px}
.achcard .d{font-size:11px;color:inherit;opacity:.8}

/* bitiş */
.endbox{position:relative;z-index:10;max-width:520px;width:100%;text-align:center;border-radius:18px;background:#141822;padding:26px}
.endicon{width:64px;height:64px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  font-size:30px;border-radius:16px;background:#f59e0b1a;border:1px solid #f59e0b66}
.endtitle{font-size:22px;font-weight:800;color:#fff;margin:8px 0}
.enddesc{color:#cbd5e1;font-size:14px;line-height:1.7;margin-bottom:14px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:#00000088;border:1px solid #1e293b;
  border-radius:12px;padding:12px;font-size:12px;text-align:left;margin-bottom:14px}
.statgrid span:nth-child(even){text-align:right}
.scorerow{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:14px}
.bigscore{font-size:28px;font-weight:900}
.achchips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:14px}
.endrow{display:flex;gap:10px;margin-bottom:12px}
.inp{flex:1;padding:10px 14px;border-radius:12px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;outline:none}
.inp:focus{border-color:#f59e0b99}
.endbtns{display:flex;gap:10px}
.endbtns .btn{flex:1}
.menulink{width:100%;margin-top:8px;padding:8px;color:#64748b;font-size:12px}
.menulink:hover{color:#cbd5e1}
.endmeta{margin-top:12px;font-size:11px}

/* bildirim (toast) */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:60;max-width:92%;width:420px;
  padding:10px 16px;border-radius:12px;font-size:12px;font-family:'JetBrains Mono',monospace;
  background:#052e16ee;border:1px solid #10b98177;color:#a7f3d0;box-shadow:0 10px 30px #000a;
  opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.toast.k-warning{background:#4c0519ee;border-color:#9f1239aa;color:#fecdd3}
.toast.k-achievement{background:#2a1c0aee;border-color:#b45309aa;color:#fde68a}
.toast.k-info{background:#052e16ee;color:#a7f3d0}

/* ================= MOR GECE v3 — GELİŞMİŞ KATMAN ================= */
#app{position:relative;z-index:1}
#gears{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#gears svg{position:absolute;opacity:.16}
@keyframes mgspin{to{transform:rotate(360deg)}}
@keyframes mgspinr{to{transform:rotate(-360deg)}}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none}
#tooltip{position:fixed;z-index:120;max-width:260px;padding:8px 10px;border-radius:8px;font-size:11px;line-height:1.5;
  background:#1c1508f2;border:1px solid #b45309aa;color:#fde68a;box-shadow:0 10px 26px #000c;
  opacity:0;transform:translateY(4px);transition:opacity .16s,transform .16s;pointer-events:none}
#tooltip.show{opacity:1;transform:none}

/* yükleme ekranı */
#loader{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(circle at 50% 38%,#1d1408 0%,#0a0b10 62%,#06070a 100%);transition:opacity .7s}
#loader.hide{opacity:0;pointer-events:none}
.ld-gears{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center}
.ld-gears svg{position:absolute}
.ld-gears svg:nth-child(1){animation:mgspin 6s linear infinite}
.ld-gears svg:nth-child(2){animation:mgspinr 4.2s linear infinite;left:52px;top:56px}
.ld-gears svg:nth-child(3){animation:mgspin 8.5s linear infinite;left:6px;top:60px}
.ld-title{font-size:13px;letter-spacing:.22em;color:#fbbf24;text-transform:uppercase}
.ld-bar{width:min(320px,72vw);height:8px;border-radius:99px;background:#0f172a;border:1px solid #3f2d10;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#b45309,#fbbf24,#fde68a);transition:width .18s}
.ld-pct{font-size:11px;color:#fcd34d}
.ld-sub{font-size:10px;color:#64748b;letter-spacing:.12em}

/* nabız atan birincil buton */
@keyframes pulseGlow{0%,100%{box-shadow:0 6px 18px rgba(245,158,11,.25)}50%{box-shadow:0 6px 26px rgba(251,191,36,.6),0 0 0 4px rgba(245,158,11,.12)}}
.btn.primary{animation:pulseGlow 3.4s ease-in-out infinite}
.bar i{transition:width .7s cubic-bezier(.2,.8,.3,1)}

/* hafta geçişi */
@keyframes wkflash{0%{opacity:0}18%{opacity:.55}100%{opacity:0}}
body.wk-flash::after{content:'';position:fixed;inset:0;z-index:150;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fde68a,#b45309 70%);animation:wkflash .52s ease-out forwards}
@keyframes wkshake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}
.gamewrap.wk-shake{animation:wkshake .42s ease-in-out}

/* karakter portresi */
.eportre{display:flex;justify-content:center;align-items:center;padding:2px 0 6px}
.eportre svg{width:104px;height:104px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.eportre .pframe{fill:#0f172a;stroke:#b45309;stroke-width:1.5}

/* typewriter */
.etext.typing::after{content:'▌';color:#fbbf24;animation:flick 1s steps(2) infinite;margin-left:2px}

/* jeton */
.chip.jeton{border-color:#a16207aa;color:#fde68a;background:#2a1c0a}
.jetonrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0;padding:8px;border-radius:10px;
  background:#1c1508cc;border:1px solid #b4530966}
.pill.dice{color:#fcd34d;background:#2a1c0a;border:1px solid #b4530988;border-radius:6px;padding:1px 6px}

/* zar */
.dice-stage{perspective:640px;height:130px;display:flex;align-items:center;justify-content:center;margin:6px 0 10px}
.dice{width:78px;height:78px;position:relative;transform-style:preserve-3d;transform:rotateX(-18deg) rotateY(22deg);transition:transform .9s cubic-bezier(.2,.8,.3,1)}
.dice .face{position:absolute;inset:0;border-radius:10px;border:2px solid #78350f;
  background:linear-gradient(145deg,#fde68a,#d97706);box-shadow:inset 0 0 14px rgba(120,53,15,.55);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;gap:1px}
.dice .pip{width:11px;height:11px;border-radius:50%;background:#3b1d05;align-self:center;justify-self:center;box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}
.dice-meta{font-size:11px;color:#fcd34d;margin-bottom:10px}
.dice-res{font-size:13px;font-weight:800;margin:8px 0;min-height:20px}

/* ayarlar */
.setrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:#cbd5e1}
.setrow label{flex:0 0 120px;color:#94a3b8}
.setrow input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:#1e293b;outline:none}
.setrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fbbf24;border:2px solid #78350f;cursor:pointer}
.setrow input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fbbf24;border:2px solid #78350f;cursor:pointer}
.setrow b{flex:0 0 46px;text-align:right}

/* teknoloji kartı ipucu */
.tcard{position:relative}
.tcard[data-tip]:hover{box-shadow:0 8px 22px rgba(245,158,11,.18)}
@media(max-width:640px){.eportre svg{width:84px;height:84px}}
.row2{flex-wrap:wrap}
.row2 .btn{flex:1 1 45%;white-space:nowrap;font-size:11px}

.shift-panel{margin-top:10px;padding-top:10px;border-top:1px solid #1e293b;display:flex;flex-direction:column;gap:8px}

.shift-ctrl{display:flex;align-items:center;gap:5px}
.sbtn{width:22px;height:22px;border-radius:6px;background:#1e2636;border:1px solid #475569;color:#fde68a;font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;line-height:1}

.cbtn{font-size:11px;padding:5px 9px;border-radius:8px;background:#172030;border:1px solid #334155;color:#cbd5e1;font-weight:600;transition:all .15s}

.slot-chip:hover{border-color:#fbbf24;color:#fde68a;transform:translateY(-1px)}
.slot-chip.oc{border-color:#f59e0b;background:#2a1905e6;color:#fcd34d;box-shadow:0 0 10px rgba(245,158,11,.35)}
.slot-chip.dmg{border-color:#f43f5e;background:#4c0519e6;color:#fecdd3;animation:pw 1.4s infinite}
.exp-prep{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;padding:10px;border-radius:10px;background:#111723;border:1px solid #263147}
@media(max-width:640px){.exp-prep{grid-template-columns:1fr}}
.prep-group h5{font-size:11px;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.prep-opts{display:flex;flex-wrap:wrap;gap:6px}
.popt{font-size:11px;padding:6px 9px;border-radius:8px;background:#171f2e;border:1px solid #334155;color:#cbd5e1;flex:1;min-width:95px;text-align:left}
.popt.sel{border-color:#22d3ee;background:#0e2a38;color:#a5f3fc;font-weight:700}
.popt:disabled{opacity:.4;cursor:not-allowed}
.freq-box{background:#0b101b;border:1px solid #4c1d95;border-radius:10px;padding:10px;margin-bottom:12px}
.freq-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:6px}
.freq-slider{width:100%;accent-color:#a855f7;cursor:pointer}
.tcard.oc-on{border-color:#f59e0b;box-shadow:inset 0 0 12px rgba(245,158,11,.2)}

.tcard-actions{display:flex;gap:6px;margin-top:8px;padding-top:6px;border-top:1px solid #1e293b}

nette ve sende. Artık biliyorsun: bu geçici değil. Bu, yeni dünya.",choices:[{label:"Kamyoneti mahalle servisine dönüştür, aileleri taşı",effects:{crew:{ciftci:1},order:6,fuel:4},log:"Kamyonet mahallenin servis aracı oldu; su ve odun taşıyor."},{label:"Depo dolusu benzin ve yedek parçayı stokla",effects:{fuel:8,copper:5},log:"Yakıt bidonları ve yedek parçalar ambara girdi."},{label:"Sadece çalışır haldeki traktörleri ve dizelleri kaydet",effects:{copper:8,spark:3,rep:{guild:4}},log:"Bölgedeki tüm çalışan mekanik araçlar listeye alındı."}]}],V0=[{id:"w1_shock",kind:"story",week:1,speaker:"Baş Usta Kemal",faction:"Torna Loncası",category:"ŞOK",avatar:"\uD83D\uDD27",portrait:"welder",text:"Mor Gece fırtınası dindi ama sanayi sitesindeki tüm mikroişlemcili tezgahlar ve modern kamyonlar yandı. Kapıda mahalleli birikti; herkes ilk 72 saatin şokunu atlatamamış durumda. Lonca olarak ilk iş neyi emniyete alalım?",choices:[{label:"Depodaki eski mekanik torna ve bakır sargıları kilitle",effects:{food:-4,copper:12,order:-4,spark:4,rep:{guild:8,rural:-3}},log:"Mekanik tezgahlar ve bakır bobinler koruma altına alındı."},{label:"Toptancı halindeki bozulabilir gıdaları halka adil dağıt",effects:{food:14,copper:-5,order:8,rep:{guild:-2,rural:6}},log:"Soğuk hava depoları durmadan önce gıdalar kurtarıldı."},{label:"Hurda araçlardan kurşun aküleri ve alternatörleri sök",effects:{food:-5,copper:9,spark:8,rep:{guild:5,dock:3}},log:"Otoyoldaki ölü araçlardan onlarca sağlam alternatör söküldü."}]},{id:"w2_water_pump",kind:"story",week:2,speaker:"Muhtar İlyas",faction:"Kırsal Kooperatif",category:"ALTYAPI",avatar:"\uD83D\uDE9C",portrait:"farmer",text:"Şehir şebekesinin elektronik pompaları sustuğu için mahallede su kesildi. Dağdan gelen eski cazibeli su hattını açabiliriz ama borular için atölyenin bakır stokları lazım.",choices:[{label:"Boruları ve contaları ver, su hattını beraber onaralım",effects:{food:14,copper:-12,order:8,rep:{rural:10},unlockMap:"dag_su_hatti"},log:"Dağ su hattı açıl
